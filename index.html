CHAPTERS.push({id:11,icon:'⚡',title:'الذبحة التشنّجية والدقيقة والمقاومة والصامتة',en:'Vasospastic, Microvascular, Refractory & Silent Ischemia',mins:10,
body:`
<div class="author">هذه "الحالات الخاصة" محبوبة جداً عند واضعي الأسئلة لأنها تكسر القواعد العامة. أهم قاعدة مكسورة: <b>حاصرات بيتا</b> — خط أول عادةً، لكنها <b>تُتجنّب</b> في الذبحة التشنّجية!</div>

<h3>1) الذبحة التشنّجية (Vasospastic / Prinzmetal / Variant)</h3>
<div class="drug">
<div class="dr"><span>المريض</span><p>أصغر سناً، عوامل خطر أقل، لكن <b>نسبة تدخين أعلى</b>.</p></div>
<div class="dr"><span>الألم</span><p>أثناء <b>الراحة</b>، <b>الصباح الباكر</b>، دوري وغير متوقع، قد يدخل في هدأة تلقائية؛ لا يثيره الجهد ولا يزول بالراحة.</p></div>
<div class="dr"><span>ECG</span><p><b>ST elevation</b> عابر (نمط أذية حالية) بدل الانخفاض.</p></div>
<div class="dr"><span>النوبة الحادة</span><p><b>Nitrates</b></p></div>
<div class="dr"><span>المزمن</span><p><b>Nitrates و CCBs</b> — و<b>تجنّب BB</b></p></div>
<div class="dr"><span>أيضاً</span><p>تقييم عوامل الخطر وتعديل نمط الحياة بقوة (خاصة التدخين)</p></div>
</div>
${BOX('exam','لماذا نتجنّب BB في التشنّج؟',`حصر مستقبلات <b>β2</b> (الموسّعة للأوعية) يترك مستقبلات <b>α</b> (المضيّقة) دون معارضة ← <b>تفاقم التشنّج</b>.`)}

<h3>2) الإقفار الدقيق (Microvascular) — ANOCA/INOCA</h3>
<p>ذبحة أو إقفار مع شرايين كبيرة غير مسدودة في القسطرة، بسبب خلل الأوعية الدقيقة أو تشنّجها. العلاج يرتكز على ضبط عوامل الخطر (ستاتين، ACEi عند المؤشر، نمط الحياة) وأدوية الأعراض حسب الآلية المسيطرة.</p>

<h3>3) الذبحة المقاومة (Refractory)</h3>
<ul class="nice"><li>استمرار الذبحة رغم تصعيد BB + CCB + nitrates طويلة المفعول + ranolazine، وعدم ملاءمة إعادة التروية.</li><li>الخيارات: الأدوية الحديثة (nicorandil، trimetazidine، ivabradine بشروطه…)، و<b>EECP</b> (النبض المعاكس الخارجي المعزّز) <span class="pill c2b">2b</span>.</li></ul>

<h3>4) الإقفار الصامت (Silent Ischemia)</h3>
${T(['البند','التفاصيل'],[
['<b>الانتشار</b>','حتى <b>80%</b> من نوبات الإقفار عند مرضى CAD صامتة؛ ويرتبط بمدى انتشار المرض'],
['<b>التصنيف</b>','<b>Class I:</b> لا يعاني ذبحة أبداً · <b>Class II:</b> نوبات عرضية وصامتة معاً'],
['<b>العلاج</b>','<b>BB خط أول</b>؛ CCB بديل مقبول لكن فائدته أقل مع <b>الذروة النهارية (diurnal surge)</b> للأحداث صباحاً؛ <b>العلاج المركّب</b> أفضل غالباً من أي دواء منفرد'],
['<b>الاكتشاف</b>','تسجيل Holter المستمر؛ شائع عند مرضى السكري']
])}
${BOX('sum','خلاصة الفصل',`<ul><li>التشنّجية: شباب مدخنون، ألم راحة صباحي، ST elevation، nitrates + CCB، <b>لا BB</b>.</li><li>الصامتة: حتى 80%، BB أولاً، المركّب أفضل.</li><li>المقاومة: EECP (2b) + الأدوية الحديثة.</li></ul>`)}
`});

CHAPTERS.push({id:12,icon:'🗣️',title:'المادة الإضافية: إرشاد المريض (مادة امتحانية)',en:'Supplementary Examinable Material: Patient Counseling',mins:15,
body:`
<div class="author">⚠️ <b>تنبيه مهم:</b> المادة الإضافية (Self-Reading) <b>جزء أساسي وامتحاني</b> من المحاضرة، وتغطي الفيزيولوجيا المرضية والصيدلة وتثقيف المريض. لا تتجاوزها! الفيزيولوجيا والصيدلة شرحتهما في الفصلين 2 و9؛ هنا أركّز على <b>الإرشاد</b> الذي يُسأل عنه كثيراً.</div>

<h3>1) إرشاد المريض على أقراص النيتروجلسرين تحت اللسان</h3>
<div class="counsel">
<div class="cs"><b>1</b><span><b>اجلس</b> (أو استلقِ) قبل الاستخدام لأنه قد يسبب دوخة. <small>(في الكتاب: الجلوس أفضل من الوقوف أو الاستلقاء الكامل)</small></span></div>
<div class="cs"><b>2</b><span>ضع <b>نصف إلى قرص</b> تحت اللسان؛ <b>لا تبلعه</b>. بعد زوال الألم يمكنك بصق أو بلع ما تبقى لتجنّب الصداع.</span></div>
<div class="cs"><b>3</b><span>يمكن التكرار كل 3–4 دقائق. <b>اتصل بالإسعاف</b> إذا لم تُزل 2–3 أقراص خلال 15 دقيقة الألم. <small>(جدول التثقيف في المرجع أكثر تحفظاً: إذا لم تُزل الجرعة الأولى الألم ← اتصل بالطوارئ، لأن معظم النوبات تزول خلال 5–10 د بالراحة وقرص واحد)</small></span></div>
<div class="cs"><b>4</b><span>احفظها في <b>العبوة الزجاجية الأصلية الداكنة</b>، بعيداً عن الرطوبة والحرارة والضوء، و<b>لا تحملها ملاصقة للجسم</b>.</span></div>
<div class="cs"><b>5</b><span>اكتب <b>تاريخ الفتح</b> على العبوة.</span></div>
<div class="cs"><b>6</b><span><b>ممنوع</b> sildenafil أو tadalafil أو vardenafil.</span></div>
<div class="cs"><b>7</b><span>الآثار الشائعة: صداع، توهّج، خفقان، هبوط ضغط انتصابي، إغماء، وذمة طرفية.</span></div>
</div>
${BOX('warn','تعارض في الأرقام داخل المرجع — انتبه!',`شريحة الإرشاد تقول: تخلّص من الأقراص غير المستخدمة بعد <b>3 أشهر</b> من الفتح. بينما جدول التثقيف (Education Point) يقول: الأقراص صالحة عادة <b>6 أشهر</b> بعد الفتح، و<b>البخاخ 3 سنوات</b>. في الامتحان، اتبع صيغة السؤال وما يركّز عليه المحاضر.`)}

<h3>2) جدول تثقيف المرضى والكوادر على SL NTG</h3>
${T(['النقطة التعليمية','السبب'],[
['احفظه في العبوة الزجاجية الداكنة الأصلية','يتحلل بضوء الشمس ويفقد قوته'],

<h3>3) إرشاد Isosorbide Mononitrate</h3>
<ul class="nice">
<li>البداية <b>30–60 mg مرة يومياً</b>، تُزاد حتى <b>120 mg مرة يومياً</b> عند الحاجة.</li>
<li><b>لا يُنصح بالجرعة مرتين يومياً</b> (من المستحضر ممتد المفعول) لأنه لن تبقى فترة خالية من النترات ← تحمّل.</li>
<li><b>يُبلع كاملاً</b>؛ لا يُسحق ولا يُمضغ.</li>
<li>خذه في الوقت الذي تكثر فيه الذبحة: <b>مساءً</b> للذبحة الليلية، <b>صباحاً</b> للذبحة النهارية.</li>
<li><b>غير مناسب للنوبة الحادة</b> لبطء بدء مفعوله.</li>
<li><b>لا تقسم Imtrate®</b> (لا دليل كافٍ أن النصف يعطي نصف الجرعة)؛ بقية المستحضرات يمكن قسمها.</li>
</ul>
${BOX('tip','لاحظ التوافق',`الجرعة الصباحية الواحدة للـ ER تعطي تغطية نهارية + فترة ليلية خالية = تطبيق عملي لحل مشكلة التحمّل.`)}

<h3>4) خطة التثقيف الفردية (Patient Education)</h3>
<ol class="nice" type="a">
<li>أهمية الالتزام بالأدوية للسيطرة على الأعراض وإبطاء تقدّم المرض.</li>
<li>شرح إدارة الأدوية وتقليل الخطر بما يحترم مستوى الفهم والقراءة والثقافة.</li>
<li>مراجعة شاملة لكل الخيارات العلاجية.</li>
<li>وصف مستويات الرياضة المناسبة والتشجيع على النشاط اليومي.</li>
<li>تعليم مهارات المراقبة الذاتية.</li>
<li>كيفية التعرّف على تدهور الأعراض والتصرّف المناسب.</li>
</ol>
<h4>عناصر نمط الحياة المؤثرة على الإنذار</h4>
<ul class="nice">
<li>ضبط الوزن: <b>BMI 18.5–24.9</b>؛ محيط الخصر <b>&lt;102 سم</b> للرجال و<b>&lt;88 سم</b> للنساء.</li>
<li>إدارة الدهون وضبط الضغط.</li>
<li>الإقلاع عن التدخين وتجنّب التدخين السلبي.</li>
<li>تغييرات فردية للتغذية ونمط الحياة لمرضى السكري.</li>
<li>من المعقول التثقيف حول: غذاء قليل الدهون المشبعة والكوليسترول والمتحولة، غني بالفاكهة والحبوب الكاملة والخضار، قليل الصوديوم مع مراعاة الثقافة؛ أعراض التوتر والاكتئاب؛ المقاربات السلوكية لإدارتهما؛ وتقييم وعلاج الاكتئاب الكبير عند الحاجة.</li>
</ul>

<h3>5) سيناريو إرشاد نموذجي (للتدريب الشفهي)</h3>
<div class="dialog">
<p><b>👨‍⚕️ الصيدلاني:</b> هذا دواء Nitroglycerin تحت اللسان. متى تشعر بألم الصدر المعتاد، اجلس أولاً ثم ضع قرصاً تحت لسانك واتركه يذوب دون بلع.</p>
<p><b>🧓 المريض:</b> وإذا لم يذهب الألم؟</p>
<p><b>👨‍⚕️ الصيدلاني:</b> إذا لم يتحسن الألم بعد القرص الأول خلال 5 دقائق اتصل بالإسعاف فوراً، ويمكنك أخذ قرص آخر كل 3–4 دقائق بحد أقصى 3 أقراص خلال 15 دقيقة.</p>
<p><b>🧓 المريض:</b> أين أحفظه؟</p>
<p><b>👨‍⚕️ الصيدلاني:</b> في هذه العبوة الزجاجية نفسها، بعيداً عن الحمّام والحرارة، واحمله معك دائماً لكن ليس في جيب ملاصق لجسمك. اكتب تاريخ فتحه وجدّده في موعده حتى لو لم ينتهِ. وتذكّر: لا تستخدم أبداً أدوية الضعف الجنسي مثل الفياجرا مع هذا الدواء.</p>
</div>
${BOX('sum','خلاصة الفصل',`<ul><li>SL NTG: اجلس، تحت اللسان، كل 3–4 د حتى 3 خلال 15 د، الإسعاف إذا لم يتحسن.</li><li>العبوة الزجاجية الأصلية، لا حمّام، لا بلاستيك، انزع القطنة، اكتب تاريخ الفتح.</li><li>ISMN ER: مرة يومياً صباحاً، يُبلع كاملاً، ليس للنوبة الحادة، لا تقسم Imtrate.</li><li>BMI 18.5–24.9، الخصر &lt;102 رجال / &lt;88 نساء.</li></ul>`)}
`});

body:`
<div class="author">Dear student, before we touch any drug or guideline, we must agree on <b>one language</b>. Half of the mistakes in this lecture come from mixing up terms: IHD, CAD, CCD, ACS… In this chapter we untangle them once and for all.</div>
<h3>1) What is ischemic heart disease?</h3>
<p>Think of the heart as an <b>engine</b> that never stops. Its fuel is <b>oxygen</b>, delivered through small pipes — the <b>coronary arteries</b>. If these pipes narrow or block, the fuel is not enough, especially when demand rises (e.g., climbing stairs). This oxygen shortage is called <b>ischemia</b>.</p>
${BOX('key','Definition (from the reference)',`Ischemic heart disease (IHD), also known as coronary artery disease (CAD), is a lack of oxygen <b>“ischemia”</b> and decreased or no blood flow to the myocardium resulting from coronary artery <b>narrowing or obstruction</b>.`)}
<h3>2) How does IHD present? (clinical phenotypes)</h3>
<div class="spectrum"><div class="sp s1"><b>Silent Ischemia</b><small>no symptoms</small></div><div class="sp s2"><b>Chronic Stable Angina</b><small>with exertion</small></div><div class="sp s3"><b>ACS</b><small>UA · NSTEMI · STEMI</small></div></div>
<ul class="nice">
<li><b>Myocardial ischemia without clinical symptoms.</b></li>
<li><b>Chronic stable exertional angina pectoris (SA).</b></li>
<li><b>Acute coronary syndrome (ACS):</b> unstable angina (UA), NSTEMI, STEMI.</li>
<li><b>Coronary vasospasm (variant / Prinzmetal angina):</b> similar symptoms, <u>but not caused by atherosclerosis</u>.</li>
</ul>
${BOX('exam','Exam point','“Which of the following is NOT caused by atherosclerosis?” → <b>Prinzmetal (vasospastic) angina</b>.')}
<h3>3) Terminology dictionary</h3>
${T(['Term','Meaning','Student note'],[
['IHD','Ischemic Heart Disease','The umbrella term'],['CAD','Coronary Artery Disease','Synonym of IHD in the reference'],['CHD','Coronary Heart Disease','Coronary manifestation of IHD (used in US statistics)'],['CCD','Chronic Coronary Disease','Term of the <b>2023 AHA/ACC</b> guideline'],['CCS (ESC)','Chronic Coronary Syndromes','Term of the <b>2024 ESC</b> guideline'],['SIHD','Stable Ischemic Heart Disease','Older title = CCD'],['CSA / SA','Chronic Stable Angina','Reproducible, predictable pattern'],['ACS','Acute Coronary Syndrome','<b>Emergency</b>: UA, NSTEMI, STEMI'],['ANOCA','Angina with No Obstructive Coronary Arteries','Angina with “clean” angiogram'],['INOCA','Ischemia with No Obstructive Coronary Arteries','Proven ischemia, no obstruction'],['MACE','Major Adverse Cardiovascular Events','CV death, MI, stroke…'],['GDMT','Guideline-Directed Medical Therapy','Guideline-recommended drugs']
])}
${BOX('warn','Trap: “CCS” has two meanings!','<b>CCS</b> may mean <b>Chronic Coronary Syndromes</b> (ESC name of the disease) or <b>Canadian Cardiovascular Society</b> (angina grading I–IV). Read the question context.')}
<h3>4) Epidemiology — the size of the problem</h3>
<div class="stats"><div class="stat"><b>239 million</b><span>people living with IHD worldwide (GBD 2023)</span></div><div class="stat"><b>8.91 million</b><span>annual IHD deaths worldwide (2023)</span></div><div class="stat"><b>193 million</b><span>DALYs attributable to IHD (2023)</span></div><div class="stat"><b>&gt;20.5 million</b><span>US adults with CHD (JACC Stats 2026)</span></div><div class="stat"><b>349,470</b><span>US CHD deaths in 2023 (AHA 2026)</span></div></div>
<h4>🇯🇴 In Jordan</h4>
<p>IHD is the <b>leading individual cause of death in Jordan</b> (WHO 2023): <b>36.3 deaths per 100,000</b> population.</p>
${BOX('warn','Do not confuse IHD with total CVD','The figure <b>15,889</b> (World Heart Federation 2024) is deaths from <b>all</b> cardiovascular diseases in Jordan — including stroke and heart failure — not IHD alone.')}
<p><b>Clinical relevance:</b> prevention targets modifiable risk factors — hypertension, elevated LDL-C, diabetes, and smoking.</p>
<h3>5) Reading guideline recommendations (COR & LOE)</h3>
<p>Each recommendation has a <b>Class of Recommendation</b> (strength) and a <b>Level of Evidence</b> (quality). The <b>wording reveals the class</b> — a great memory shortcut:</p>
${T(['COR','Meaning','Typical wording'],[
['<span class="pill c1">1</span>','Strong: benefit ≫ risk','is recommended / is indicated / should be'],['<span class="pill c2a">2a</span>','Moderate: benefit &gt; risk','is reasonable / can be useful / can be beneficial'],['<span class="pill c2b">2b</span>','Weak: benefit ≥ risk','may be reasonable / may be considered'],['<span class="pill c3NB">3: No Benefit</span>','No benefit','is not recommended / not useful'],['<span class="pill c3H">3: Harm</span>','Risk &gt; benefit','potentially harmful / should not be used']
])}
${T(['LOE','Source of evidence'],[['<b>A</b>','High quality: &gt;1 RCT or meta-analyses'],['<b>B-R</b>','Moderate, randomized'],['<b>B-NR</b>','Moderate, nonrandomized/observational'],['<b>C-LD</b>','Limited data'],['<b>C-EO</b>','Expert opinion']])}
${BOX('tip','Author’s tip','In this app every recommendation is colored like the ACC/AHA guideline: <span class="pill c1">green = 1</span> <span class="pill c2a">yellow = 2a</span> <span class="pill c2b">orange = 2b</span> <span class="pill c3H">red = 3 Harm</span>.')}
<h3>References used in the lecture</h3>
<ol class="refs"><li>Pharmacotherapy Principles &amp; Practice, 12th ed. — Chapter 33</li><li>2023 AHA/ACC Guideline for Chronic Coronary Disease</li><li>2024 ESC Guidelines for Chronic Coronary Syndromes</li><li>2026 ACC/AHA Guideline on the Management of Dyslipidemia</li></ol>
${BOX('sum','Chapter summary','<ul><li>IHD = CAD = myocardial O₂ deficit due to coronary narrowing/obstruction.</li><li>Spectrum: silent ischemia → stable angina → ACS (UA, NSTEMI, STEMI).</li><li>Prinzmetal = spasm, not atherosclerosis.</li><li>IHD is the #1 cause of death in Jordan (36.3/100,000).</li><li>COR: 1 recommended, 2a reasonable, 2b may be considered, 3 no benefit/harm.</li></ul>')}

CHAPTERS_EN.push({id:2,icon:'🫀',title:'Pathophysiology: Supply, Demand & Atherosclerosis',en:'الفيزيولوجيا المرضية',mins:18,
body:`
<div class="author">This chapter is the <b>key to understanding every drug</b>. Each antianginal either increases oxygen supply or decreases oxygen demand. Master the balance below and you will deduce mechanisms instead of memorizing them.</div>
<h3>1) The balance: oxygen supply vs demand</h3>
<div class="balance"><div class="pan sup"><h5>⬆️ Oxygen Supply</h5><ul><li>Coronary blood flow</li><li>Oxygen extraction</li><li>Oxygen availability<small>(O₂ saturation, Hb concentration)</small></li></ul></div><div class="fulcrum">⚖️</div><div class="pan dem"><h5>⬆️ Oxygen Demand (MVO₂)</h5><ul><li>Heart rate</li><li>Contractility</li><li>Intramyocardial wall tension<small>(affected by preload & afterload)</small></li></ul></div></div>
<p>In most stable situations <b>supply is fixed</b> (a stable plaque narrows the artery) and ischemia occurs when <b>demand rises</b>. Therefore, altering <b>MVO₂</b> is critical both in producing ischemia and in treating it.</p>
${BOX('mem','Memorize demand as H-C-W','<b>H</b>eart rate – <b>C</b>ontractility – <b>W</b>all tension. Beta-blockers ↓H and ↓C; nitrates ↓preload → ↓W.')}
<h3>2) What reduces supply?</h3>
<ul class="nice"><li><b>Reduced coronary flow:</b> atherosclerotic plaque, vasospasm, or thrombus.</li><li><b>Reduced arterial O₂ content:</b> hypoxia.</li><li><b>Tachycardia:</b> coronaries fill during <b>diastole</b>; shorter diastole = less perfusion. <span class="hl">Tachycardia is doubly harmful: ↑demand and ↓supply.</span></li><li><b>Reduced O₂-carrying capacity:</b> anemia, carbon monoxide poisoning, cyanotic congenital heart disease — can cause ischemia <b>even with adequate perfusion</b>.</li></ul>
${BOX('key','Stable angina vs ACS','<b>Stable angina:</b> fixed atherosclerotic plaque → problem is <b>increased demand</b>.<br><b>ACS:</b> <b>plaque disruption</b> + thrombus → <b>abrupt</b> fall in supply.')}
<h3>3) The story of atherosclerosis</h3>
<p>Atherosclerosis is a <b>complex, lifelong process</b>, and <b>inflammation</b> plays a fundamental role in <b>all stages</b> (this explains the role of statins and colchicine).</p>
<div class="steps"><div class="st"><b>1</b><span>Normal coronary artery (Panel A)</span></div><div class="st"><b>2</b><span><b>Stable plaque</b>: small lipid core, thick fibrous cap made of several layers of smooth muscle cells (Panel B)</span></div><div class="st"><b>3</b><span><b>Unstable plaque</b>: large lipid core, thin cap → fissures</span></div><div class="st"><b>4</b><span>Platelet adhesion to the fissured plaque → mesh-like partial occlusion</span></div><div class="st"><b>5</b><span>Occlusive thrombus → infarction</span></div></div>
${BOX('tip','Link to therapy','Clot starts with platelets → <b>antiplatelets</b> prevent events. Plaque is lipid-rich → <b>statins</b> stabilize it. PCI/CABG <b>compress, cut away, or bypass</b> plaques to improve supply.')}
<h3>4) The four types of angina</h3>
${T(['Type','Mechanism','Features'],[
['<b>1. Stable</b>','Fixed atherosclerosis','Predictable episodes related to cardiac work (MVO₂); precipitated by exercise, cold, stress, emotion, eating; chronic, needs prophylactic medication'],
['<b>2. Unstable</b>','Recurrent small platelet clots on a ruptured plaque ± local vasospasm','Change in character, frequency, duration; prolonged rest pain. <b>Urgent</b> — part of ACS'],
['<b>3. Prinzmetal</b>','Transient coronary vasospasm (± atheroma)','Younger, few risk factors; unpredictable, cyclical; <b>at rest and early morning</b>; not exertional, not relieved by rest; <b>ST elevation</b>'],
['<b>4. Silent</b>','Transient ischemia without symptoms','ECG changes without angina; very common on Holter monitoring']
])}
<h3>5) Three mechanisms of ischemia</h3>
<div class="cards3"><div class="mini"><b>Obstructive</b><span>A plaque narrows an epicardial artery (most common).</span></div><div class="mini"><b>Vasospastic</b><span>Transient constriction of a coronary artery.</span></div><div class="mini"><b>Microvascular</b><span>Small-vessel dysfunction: normal-looking angiogram yet ischemia (ANOCA/INOCA).</span></div></div>
<h3>6) Conditions provoking or exacerbating ischemia</h3>
${T(['Increased O₂ demand','Decreased O₂ supply'],[
['<b>Non-cardiac:</b> hyperthermia, hyperthyroidism, sympathomimetic toxicity (cocaine), hypertension, anxiety, arteriovenous fistula','<b>Non-cardiac:</b> anemia, hypoxemia (pneumonia, asthma, COPD, pulmonary hypertension, interstitial fibrosis, obstructive sleep apnea), sickle-cell disease, cocaine, hyperviscosity (polycythemia, leukemia, thrombocytosis, hypergammaglobulinemia)'],
['<b>Cardiac:</b> hypertrophic cardiomyopathy, aortic stenosis, dilated cardiomyopathy, tachycardia (ventricular, supraventricular)','<b>Cardiac:</b> aortic stenosis, hypertrophic cardiomyopathy']
])}
${BOX('exam','Watch out','<b>Cocaine</b>, <b>aortic stenosis</b> and <b>hypertrophic cardiomyopathy</b> appear in BOTH columns — a favorite question!')}
${BOX('sum','Chapter summary','<ul><li>Supply: flow + extraction + O₂ availability. Demand: HR + contractility + wall tension.</li><li>Coronaries fill in diastole → tachycardia ↓supply.</li><li>Stable = demand on fixed plaque; ACS = plaque rupture + thrombus.</li><li>Inflammation is present in every stage of atherosclerosis.</li></ul>')}
`});

body:`
<div class="author">In the pharmacy or clinic, your first question is: <b>is this stable angina I can manage, or ACS that needs immediate emergency referral?</b> This chapter teaches you to tell the difference.</div>
<h3>1) Why distinguish CSA from UA?</h3>
<p><b>UA</b> carries a greater risk of MI and death and requires <b>more aggressive</b> treatment. <b>CSA</b> symptoms are <b>reproducible</b> because they are driven by demand: same quality, location and accompanying symptoms at a similar level of exertion. <b>Exception:</b> vasospasm — symptoms are variable and unpredictable.</p>
<p>CSA patients are usually in <b>no acute distress</b>. A patient in acute distress → suspect <b>ACS</b>.</p>
<h3>2) Five components of chest pain</h3>
<div class="five"><div><b>1</b>Quality</div><div><b>2</b>Location</div><div><b>3</b>Duration</div><div><b>4</b>Provoking</div><div><b>5</b>Relieving</div></div>
<ul class="nice"><li><b>Typical pain:</b> pressure, heaviness or squeezing in the anterior chest. <span class="hl">Sharp pain is NOT typical of IHD.</span></li><li><b>Radiation:</b> neck, jaw, shoulder, back, or arm.</li><li><b>Associated:</b> dyspnea, nausea, vomiting, diaphoresis.</li><li><b>Provoked by:</b> exertion (walking, stairs, house/yard work), emotional stress, <b>cold</b>, <b>heavy meals</b>.</li><li><b>Relieved by:</b> rest or sublingual nitroglycerin within minutes.</li></ul>
<h3>3) Clinical classification of chest pain (table)</h3>
${T(['Item','Details'],[
['<b>Symptoms</b>','Pressure/heavy weight on chest; tightness, burning, crushing, squeezing, vicelike, aching or “deep”; gradual increase then gradual fading (vs esophageal spasm); SOB with constriction about the larynx'],
['<b>Duration</b>','<b>0.5–30 min</b>'],
['<b>Location</b>','Over or near the sternum; anywhere between epigastrium and pharynx; occasionally left shoulder/arm only; rarely right arm only; lower cervical/upper thoracic spine; left interscapular area'],
['<b>Radiation</b>','Medial left arm, left shoulder, jaw, occasionally right arm'],
['<b>ECG</b>','<b>ST-segment depression</b> and/or <b>T-wave inversion</b>'],
['<b>Precipitants</b>','Exercise, arms above head, cold, walking against wind, after a large meal, emotions (fright, anger, anxiety), coitus'],
['<b>NTG relief</b>','Within <b>45 sec – 5 min</b>']
])}
<h3>4) Typical or atypical?</h3>
${T(['Category','Criteria'],[['<b>Typical (definite)</b>','All 3: ① substernal discomfort of characteristic quality & duration ② provoked by exertion/emotional stress ③ relieved by rest or NTG'],['<b>Atypical (probable)</b>','Meets <b>2</b> of the 3'],['<b>Noncardiac</b>','Meets <b>1 or none</b>']])}
${BOX('warn','Special populations','<b>Women and diabetics</b> may present atypically: indigestion, gastric fullness, dyspnea. Diabetics may have dyspnea and diaphoresis <b>without any chest pain</b>. Ischemia without symptoms = <b>silent ischemia</b>.')}
<h3>5) Canadian Cardiovascular Society (CCS) grading</h3>
<p>Symptom severity does <b>not</b> correlate with CAD severity, but should be assessed for diagnosis and treatment. The CCS grades <b>disability</b> from angina, and it showed a statistically significant correlation with angiographic severity.</p>
<div class="ccs"><div class="cc c1"><b>Class I</b><span>Ordinary activity does not cause angina; only strenuous, rapid or prolonged exertion.</span></div><div class="cc c2"><b>Class II</b><span><b>Slight limitation</b>: walking/climbing quickly, uphill, after meals, cold/wind, stress, first hours after waking, &gt;2 blocks or &gt;1 flight at normal pace.</span></div><div class="cc c3"><b>Class III</b><span><b>Marked limitation</b>: angina on walking 1–2 blocks or climbing 1 flight at normal pace.</span></div><div class="cc c4"><b>Class IV</b><span>Angina may be present <b>at rest</b>; no activity without discomfort.</span></div></div>
${BOX('mem','Memory trick','<b>I</b> = strenuous only · <b>II</b> = more than 1 flight/2 blocks · <b>III</b> = 1 flight/1–2 blocks · <b>IV</b> = rest.')}
<h3>6) 🚨 Red flags — when to refer to the emergency department</h3>
${BOX('warn','Suspect ACS if any of the following','<ul><li>Pain <b>at rest</b> without provocation.</li><li><b>Prolonged</b> pain unrelieved by sublingual NTG.</li><li>Change in <b>character, frequency or duration</b> of previously stable angina.</li><li>Patient in <b>acute distress</b>.</li><li>Per the education table: if the <b>first</b> SL NTG does not relieve pain → call emergency services; never exceed 2–3 tablets in 15 minutes.</li></ul>')}
${BOX('sum','Chapter summary','<ul><li>Stable angina: predictable, exertional, 0.5–30 min, relieved by rest/NTG in 45 s–5 min.</li><li>Typical = 3 features, atypical = 2, noncardiac = 0–1.</li><li>CCS I–IV: from strenuous effort to rest.</li><li>Rest / prolonged / NTG-unresponsive pain = ACS until proven otherwise.</li></ul>')}
`});

/* ===== CH4 ===== */
CHAPTERS_EN.push({id:4,icon:'🔬',title:'Diagnostic Evaluation & Risk Stratification',en:'التقييم التشخيصي وتصنيف الخطورة',mins:12,
body:`
<div class="author">As a pharmacist you won’t read an MPI scan, but you must know <b>when</b> testing is indicated and how patients are <b>risk-stratified</b>, because risk drives treatment intensity.</div>
<h3>1) When to re-test?</h3>
${RE('1','B-NR','In patients with CCD and a <b>change in symptoms or functional capacity that persists despite GDMT</b>, stress PET/SPECT MPI, CMR, or stress echocardiography is recommended to detect ischemia, estimate MACE risk, and guide decisions.')}
${T(['Abbreviation','Test'],[['PET/SPECT MPI','Nuclear myocardial perfusion imaging under stress'],['CMR','Cardiovascular magnetic resonance'],['Stress echo','Echocardiography under stress'],['ICA','Invasive coronary angiography'],['EST','Exercise stress test']])}
<h3>2) Annual risk categories</h3>
${RE('1','B-NR','Risk stratification should incorporate all available information or validated scores to classify patients as <b>low (&lt;1%), intermediate (1–3%), or high (&gt;3%) yearly risk</b> of CV death or nonfatal MI.')}
<div class="risk"><div class="rk lo"><b>&lt; 1%</b><span>Low</span></div><div class="rk mid"><b>1 – 3%</b><span>Intermediate</span></div><div class="rk hi"><b>&gt; 3%</b><span>High</span></div></div>
${RE('1','A','<b>Optimization of GDMT</b> is recommended to reduce MACE.')}
${RE('1','A','<b>Newly reduced LV systolic function, clinical HF, or both</b>: ICA is recommended to assess anatomy and guide revascularization.')}
${RE('3NB','A','ICA for risk stratification is <b>not routinely recommended</b> without LV dysfunction, HF, angina refractory to GDMT, and/or noninvasive testing suggesting significant (&gt;50%) left main disease.')}
<h3>3) Features associated with higher MACE risk (Table 5)</h3>
<div class="chips"><span>Age</span><span>Male</span><span>Poor social support</span><span>Poverty / poor access</span><span>Elevated BMI</span><span>Previous MI, PCI, CABG</span><span>Heart failure</span><span>AF / flutter</span><span>Diabetes</span><span>Dyslipidemia</span><span>CKD</span><span>Current/former smoker</span><span>PAD</span><span>Depression</span><span>Poor adherence to GDMT</span></div>
<h4>Ancillary testing</h4>
<ul class="nice"><li>Inability to exercise; angina with stress.</li><li><b>ECG:</b> LBBB, LVH, higher resting HR.</li><li><b>Echo:</b> reduced LVEF, LVH.</li><li><b>EST:</b> higher DTS, higher resting HR, achieved HR &lt;85% predicted.</li></ul>
${BOX('exam','Note','<b>Poor adherence</b>, <b>depression</b> and <b>poverty</b> are official risk features — this justifies the pharmacist’s role in education and follow-up.')}
<h3>4) ANOCA / INOCA</h3>
<p>Some patients have real angina while angiography shows no significant obstruction: <b>ANOCA</b> (angina) or <b>INOCA</b> (proven ischemia). The cause is usually <b>coronary microvascular dysfunction</b> or <b>vasospasm</b>. Key message: <u>a normal angiogram does not mean a healthy patient</u> — risk factors and symptoms still need treatment.</p>
${BOX('sum','Chapter summary','<ul><li>Symptom change despite GDMT → stress imaging (1, B-NR).</li><li>Annual risk: &lt;1% low, 1–3% intermediate, &gt;3% high.</li><li>New LV dysfunction/HF → ICA (1, A); no routine ICA just for stratification (3: No Benefit).</li></ul>')}
`});

/* ===== CH5 ===== */
CHAPTERS_EN.push({id:5,icon:'🎯',title:'Therapeutic Goals & Individualized Care',en:'أهداف العلاج والخطة الفردية',mins:14,
body:`
<div class="author">Now the heart of the subject: <b>treatment</b>. See the big picture first. Therapy for stable IHD flies on <b>two wings</b>: one prolongs life, the other improves quality of life.</div>
<h3>1) Goals of therapy</h3>
<div class="cards2"><div class="mini g"><b>🛡️ Prevent events (prognosis)</b><span>Reduce MACE: death, MI, stroke; slow progression.<br><small>Tools: aspirin, statin, ACEi/ARB, beta-blocker (specific cases), SGLT2i/GLP-1 RA, lifestyle.</small></span></div><div class="mini b"><b>😌 Relieve symptoms</b><span>Fewer angina attacks, better exercise capacity and QOL.<br><small>Tools: SL NTG, BB, CCB, long-acting nitrates, ranolazine, ± revascularization.</small></span></div></div>
${BOX('exam','Key question','<b>Which drugs improve survival?</b> Antiplatelets, statins, ACEi/ARB (with indications), beta-blockers (LVEF ≤40%). <b>Nitrates and ranolazine</b> relieve symptoms only.')}
<h3>2) Comprehensive treatment algorithm (Pharmacotherapy)</h3>
<div class="algo"><div class="col"><div class="ah">🛡️ Risk factor modification</div><div class="an">Lifestyle: diet, exercise, weight reduction, smoking cessation</div><div class="an">Annual influenza vaccination</div><div class="an">Comorbidities:<br>HTN: BP &lt;130/80 · DM: HbA1c ≤7% · moderate-to-high intensity statin</div><div class="an">Antiplatelet: aspirin 81 mg daily<br>or clopidogrel 75 mg if aspirin allergy<br><small>DAPT may be reasonable in certain high-risk patients</small></div><div class="an">ACE inhibitor if HTN, DM, LVEF ≤40% or CKD<br>or ARB if intolerant</div></div>
<div class="col"><div class="ah">😌 Management of angina</div><div class="an">SL nitroglycerin for acute attacks (everyone)</div><div class="ad">Vasospastic angina?</div><div class="an"><b>Yes:</b> BP &lt;130/80 → add LA nitrate; BP ≥130/80 → add CCB</div><div class="an"><b>No:</b> HR &gt;60 → ① beta-blocker ② non-DHP CCB</div><div class="ad">Symptoms controlled?</div><div class="an"><b>Yes:</b> continue & monitor</div><div class="an"><b>No:</b> BP &lt;130/80 → add ranolazine or LA nitrate<br>BP ≥130/80 → add DHP CCB</div><div class="an red">Continued angina → consider PCI or CABG</div></div></div>
${BOX('tip','Understand the logic (don’t memorize it)','Why add a <b>DHP CCB</b> when BP is high? It lowers BP too — double benefit. Why <b>ranolazine</b> when BP is low? It has minimal effect on BP and HR. Why avoid starting a BB if HR &lt;60? It worsens bradycardia.')}
<h3>3) The ABCDE mnemonic</h3>
${T(['Letter','Meaning'],[['<b>A</b>','Antiplatelet (aspirin) + Antianginal + ACEi/ARB'],['<b>B</b>','Beta-blocker + Blood pressure control'],['<b>C</b>','Cholesterol (statin) + Cigarette cessation'],['<b>D</b>','Diet + Diabetes control'],['<b>E</b>','Education + Exercise (cardiac rehab)']])}
<h3>4) Individualized care</h3>
<p>Drug selection depends on <b>HR, BP, LVEF, comorbidities, adverse effects, interactions</b> and <b>patient preferences</b>. For PCI vs CABG we add anatomy, symptom severity, surgical risk, and anticipated benefit.</p>
<h4>An individualized education plan includes:</h4>
<ol class="nice"><li>Importance of medication adherence for symptoms and slowing progression.</li><li>Explaining medications and risk reduction at the patient’s level of understanding, literacy and culture.</li><li>Comprehensive review of all therapeutic options.</li><li>Appropriate exercise levels and encouraging daily activity.</li><li>Self-monitoring skills.</li><li>Recognizing worsening symptoms and taking appropriate action.</li></ol>
${BOX('sum','Chapter summary','<ul><li>Two wings: prevent MACE + relieve symptoms.</li><li>Nitrates and ranolazine: symptoms only.</li><li>BB first if HR &gt;60 and not vasospastic; vasospastic → CCB/nitrate.</li><li>ABCDE covers the whole plan.</li></ul>')}
`});

/* ===== CH6 ===== */
CHAPTERS_EN.push({id:6,icon:'🥗',title:'Lifestyle, Smoking, Exercise, Rehab & Immunizations',en:'نمط الحياة والتدخين والرياضة واللقاحات',mins:20,
body:`
<div class="author">Don’t underestimate this chapter! Exams love direct questions on <b>numbers</b> (sodium, weekly exercise minutes) and on <b>3: Harm</b> recommendations.</div>
<h3>1) Nutrition</h3>
${RE('1','B-R','A diet emphasizing <b>vegetables, fruits, legumes, nuts, whole grains, and lean protein</b> is recommended.')}
${RE('2a','B-NR','Reducing saturated fat to <b>&lt;6% of total calories</b>, replacing it with mono/polyunsaturated fat, complex carbohydrates and fiber, can be beneficial.')}
${RE('2a','B-NR','Minimizing sodium (<b>&lt;2,300 mg/d; optimally 1,500 mg/d</b>) and processed meats can be beneficial.')}
${RE('2a','B-NR','Limiting refined carbohydrates (white bread, white rice, refined cereals) and sugar-sweetened beverages can be beneficial.')}
${RE('3H','B-NR','<b>Trans fat should be avoided</b> (↑ morbidity and mortality).')}
${RE('3NB','B-NR','Dietary supplements — <b>omega-3, vitamins C, D, E, beta-carotene, calcium</b> — are not beneficial to reduce CVD events.','A classic exam question.')}
<h4>Figure 7: Recommended nutrition</h4>
<div class="food"><div class="fd ok"><b>✅ Choose these</b><ul><li>Vegetables, fruit</li><li>Legumes, nuts</li><li>Whole grains</li><li>Lean protein</li><li>Complex carbs, fiber</li><li>Monounsaturated fat (≤20% of calories, e.g., olive oil)</li><li>Polyunsaturated fat (≤10%, e.g., salmon)</li></ul></div><div class="fd mid"><b>⚠️ Instead of these</b><ul><li>Saturated fat (≤6% of calories)</li><li>Sodium (1500–2300 mg/day)</li><li>Processed meat</li><li>Refined carbs (white bread, rice)</li><li>Sugar-sweetened beverages</li><li>Alcoholic beverages</li></ul></div><div class="fd no"><b>⛔ Avoid trans fat</b><ul><li>Baked goods</li><li>Foods fried in hydrogenated oil/shortening</li></ul></div></div>
<h3>2) Mental health</h3>
${RE('2a','B-R','Targeted discussions and <b>screening for mental health</b> with referral are reasonable.')}
${RE('2a','B-R','Treating mental health conditions (drug and/or non-drug) is reasonable to improve CV outcomes.')}
<h3>3) Tobacco 🚭</h3>
${RE('1','A','Assess tobacco use <b>at every visit</b>.')}
${RE('1','A','Advise smokers to quit <b>at every visit</b>.')}
${RE('1','A','<b>Behavioral interventions + pharmacotherapy</b> (bupropion, varenicline, or combination long- + short-acting NRT).')}
${RE('2b','B-R','<b>Varenicline</b> may be considered over bupropion or NRT.')}
${RE('2b','B-R','Short-term nicotine <b>e-cigarettes</b> may be considered, though sustained use and unknown long-term safety may outweigh benefits.')}
${RE('3H','B-NR','Avoid <b>secondhand smoke</b>.')}
<h3>4) Alcohol & substances</h3>
${RE('1','C-LD','Routinely ask and counsel about substance use.')}
${RE('2a','B-NR','If drinking, limit to <b>≤1 drink/d (women), ≤2 drinks/d (men)</b>.')}
${RE('3NB','B-NR','Do <b>not advise alcohol</b> for cardiovascular protection.')}
<h3>5) Sexual health</h3>
${RE('2a','B-NR','Individualize resumption of sexual activity (type of activity, exercise capacity, post-procedural healing).')}
${RE('2a','B-NR','Cardiac rehab and regular exercise reduce complications with sexual activity.')}
${RE('3H','B-NR','<b>PDE5 inhibitors must not be used with nitrates</b> — severe hypotension.','Washout: sildenafil/vardenafil 24 h, tadalafil 48 h.')}
<h3>6) Weight management</h3>
${RE('1','C-EO','Assess <b>BMI ± waist circumference</b> at follow-up.')}
${RE('1','B-NR','Counsel overweight/obese patients on diet, lifestyle and weight-loss goals.')}
${RE('2a','B-R','When drug therapy is warranted, a <b>GLP-1 RA</b> can be beneficial; choose <b>semaglutide over liraglutide</b>.')}
${RE('2a','B-NR','Severe obesity not meeting goals, acceptable surgical risk → <b>bariatric</b> referral is reasonable.')}
${RE('3H','B-R','<b>Sympathomimetic weight-loss drugs</b> are potentially harmful.','They ↑HR and BP → ↑O₂ demand.')}
<p><b>Targets:</b> BMI <b>18.5–24.9</b> kg/m²; waist <b>&lt;102 cm (40 in) men</b>, <b>&lt;88 cm (35 in) women</b>.</p>
<h3>7) Cardiac rehabilitation & physical activity 🏃</h3>
${RE('1','A / B-R / C-LD','Refer to <b>cardiac rehabilitation</b>: after recent MI, PCI or CABG (A); stable angina or heart transplant (B-R); after spontaneous coronary artery dissection (C-LD).')}
${RE('1','A','<b>≥150 min/wk moderate</b> or <b>≥75 min/wk vigorous</b> aerobic activity.')}
${RE('1','B-R','<b>Resistance training ≥2 days/wk</b>.')}
${RE('2a','B-NR','Light activities (e.g., walking breaks at work) to <b>reduce sitting time</b>.')}
<div class="stats"><div class="stat"><b>150</b><span>min/week moderate</span></div><div class="stat"><b>75</b><span>min/week vigorous</span></div><div class="stat"><b>2+</b><span>days/week resistance</span></div></div>
<h3>8) Environmental exposures</h3>
${RE('2a','B-NR','Minimize exposure to <b>ambient air pollution</b>.')}
${RE('2b','B-NR','Minimize climate-related exposures (extreme temperatures, wildfire smoke).')}
<h3>9) Immunizations 💉</h3>
${RE('1','A','<b>Annual influenza vaccine</b> ↓ CV morbidity, CV death and all-cause death.')}
${RE('1','C-EO','<b>COVID-19 vaccination</b> per public health guidelines.')}
${RE('2a','B-NR','<b>Pneumococcal vaccine</b> is reasonable.')}
${BOX('sum','Numbers to memorize','<ul><li>Saturated fat &lt;6%; sodium &lt;2300 (optimal 1500) mg/d.</li><li>Trans fat, secondhand smoke, PDE5i + nitrates, sympathomimetic weight-loss drugs = <b>3: Harm</b>.</li><li>Supplements (omega-3, vitamins) = <b>No Benefit</b>.</li><li>Exercise ≥150 min moderate or ≥75 vigorous + resistance ≥2 d.</li><li>Alcohol ≤1 (women) / ≤2 (men); never advised for protection.</li><li>Semaglutide over liraglutide.</li></ul>')}
`});

CHAPTERS_EN.push({id:7,icon:'💊',title:'Event Prevention: Lipids & Antithrombotics',en:'الوقاية من الأحداث: الدهون ومضادات التخثر',mins:30,
body:`
<div class="author">This is the heaviest and most-examined chapter: it contains the <b>new 2026 LDL goals</b> and the <b>antiplatelet durations</b>. Take it in doses: lipids first, then antithrombotics, then other preventive drugs.</div>
<h2 class="part">Part 1: Lipid lowering</h2>
<h3>1) 2023 CCD guideline</h3>
${RE('1','A','<b>High-intensity statin</b> aiming for <b>≥50% LDL-C reduction</b> to reduce MACE. <i>(ESC 2024: LDL &lt;55 mg/dL)</i>')}
${RE('1','A','If high-intensity is contraindicated/not tolerated: <b>moderate-intensity statin</b> aiming for <b>30–49%</b> reduction.')}
${RE('1','A','<b>Fasting lipids 4–12 weeks</b> after starting/adjusting a statin, then <b>every 3–12 months</b> as needed.')}
<h3>2) Statin intensity (Table 11) — memorize!</h3>
${T(['High<br>↓LDL ≥50%','Moderate<br>↓LDL 30–49%','Low<br>↓LDL &lt;30%'],[['<b>Atorvastatin 40–80 mg</b>','Atorvastatin 10 (20) mg','Simvastatin 10 mg'],['<b>Rosuvastatin 20 (40) mg</b>','Rosuvastatin (5) 10 mg','Pravastatin 10–20 mg'],['—','Simvastatin 20–40 mg','Lovastatin 20 mg'],['—','Pravastatin 40 (80) mg','Fluvastatin 20–40 mg'],['—','Lovastatin 40 (80) mg','—'],['—','Fluvastatin XL 80 / 40 mg BID','—'],['—','Pitavastatin 1–4 mg','—']],'small')}
${BOX('mem','Memory trick','Only <b>two</b> statins reach high intensity: <b>A</b>torvastatin 40–80 and <b>R</b>osuvastatin 20–40 → “<b>AR</b> = high”.')}
<h3>3) New LDL goals — 2026 ACC/AHA dyslipidemia guideline</h3>
<div class="goals"><div class="gl"><h5>ASCVD <u>not</u> at very high risk</h5><b>LDL-C &lt;70</b><b>non-HDL &lt;100</b><small>mg/dL · high-intensity statin (≥50%)</small></div><div class="gl vh"><h5>ASCVD at <u>very high risk</u></h5><b>LDL-C &lt;55</b><b>non-HDL &lt;85</b><small>mg/dL · high-intensity statin (≥50%)</small></div></div>
<h4>a) Not at very high risk</h4>
${RE('1','—','High-intensity statin for ≥50% reduction and goal <b>LDL-C &lt;70 / non-HDL-C &lt;100 mg/dL</b>.')}
${RE('2a','—','On maximally tolerated statin, reasonable to add <b>ezetimibe, a PCSK9 mAb, or bempedoic acid</b> to reach &lt;70 / &lt;100.')}
${RE('2a','—','Reasonable to add the same agents to reach a lower goal <b>&lt;55 / &lt;85</b>.')}
<h4>b) Very high risk</h4>
${RE('1','—','High-intensity statin for ≥50% lowering and goal <b>LDL-C &lt;55 / non-HDL-C &lt;85 mg/dL</b>.')}
${RE('1','—','<b>Ezetimibe and/or a PCSK9 mAb should be added</b> if not at goal on maximally tolerated statin.')}
${RE('2a','—','Reasonable to add <b>bempedoic acid</b> (± ezetimibe and/or PCSK9 mAb).')}
${RE('2a','—','Reasonable to add <b>inclisiran</b> if unable to tolerate/obtain evolocumab or alirocumab, or with strong preference for less frequent dosing.')}
${BOX('exam','The difference that gets asked','In <b>very high risk</b>, adding ezetimibe/PCSK9 mAb = <span class="pill c1">1 (should)</span>; otherwise = <span class="pill c2a">2a (reasonable)</span>.')}
<h3>4) Who is “very high risk”?</h3>
<div class="vhr"><div class="vb"><b>≥ 2</b> major ASCVD events</div><div class="or">OR</div><div class="vb"><b>1</b> major event <b>+ ≥ 2</b> high-risk conditions</div></div>
${T(['High-risk conditions'],[['Age ≥65'],['Prior CABG or PCI'],['Current smoker'],['Diabetes'],['Hypertension'],['History of congestive HF'],['LDL-C ≥100 mg/dL despite maximally tolerated statin + ezetimibe']])}
<p class="small">Major ASCVD events (from ACC/AHA guidelines): recent ACS, history of MI, ischemic stroke, symptomatic PAD. 📝 The lecture also warns to consider interactions between lipid-lowering drugs and antiretrovirals.</p>
${BOX('tip','Try the tool','In <b>Tools</b> you’ll find the “LDL goal calculator” that classifies very high risk and shows the target.')}
<h3>5) Figure 8: escalation steps</h3>
<div class="flow"><div class="fs">Healthy lifestyle for all</div><div class="arr">⬇</div><div class="fs g">High-intensity statin (≥50% ↓)</div><div class="arr">⬇ if not tolerated</div><div class="fs y">Moderate-intensity statin</div><div class="arr">⬇ if goal not met</div><div class="fs g">Add ezetimibe and/or PCSK9 mAb</div><div class="arr">⬇ if insufficient/not tolerated</div><div class="fs o">Bempedoic acid, or inclisiran (in place of PCSK9 mAb)</div></div>
<p class="small">* Effect of bempedoic acid and inclisiran on MACE is being evaluated. ** On maximal statin with LDL-C &lt;100 and persistent fasting TG <b>150–499 mg/dL</b> after addressing secondary causes → <b>icosapent ethyl</b> may be considered <span class="pill c2b">2b</span>.</p>
<h2 class="part">Part 2: Antiplatelets & oral anticoagulants (OAC)</h2>
<h3>6) No OAC indication</h3>
${RE('1','A','<b>Aspirin 81 mg (75–100 mg)</b> to reduce atherosclerotic events.')}
${RE('1','A','After PCI: <b>DAPT (aspirin + clopidogrel) for 6 months</b>, then SAPT.')}
${RE('2a','A','After DES with <b>1–3 months of DAPT</b>: <b>P2Y12 inhibitor monotherapy ≥12 months</b> to reduce bleeding.')}
${RE('2b','A','Prior MI and <b>low bleeding risk</b>: extended DAPT beyond 12 months up to <b>3 years</b>.')}
${RE('2b','B-R','Prior MI <b>without</b> stroke/TIA/ICH: <b>vorapaxar</b> may be added to aspirin.')}
${RE('2b','B-R','DAPT after <b>CABG</b> may reduce saphenous vein graft occlusion.')}
${RE('3NB','A','Without recent ACS or PCI indication: adding <b>clopidogrel to aspirin is not useful</b>.')}
${RE('3H','A','Prior stroke/TIA/ICH: <b>no vorapaxar</b> on top of DAPT.')}
${RE('3H','B-R','Prior stroke/TIA/ICH: <b>no prasugrel</b> (fatal bleeding).')}
${RE('3H','B-R','<b>No chronic NSAIDs</b>.')}
${BOX('mem','Forbidden after stroke','Stroke / TIA / ICH → <b>no Vorapaxar, no Prasugrel</b>: “<b>V</b>ery <b>P</b>rohibited after stroke”.')}
<h3>7) OAC needed (e.g., atrial fibrillation)</h3>
${RE('1','B-R','After elective PCI on OAC: <b>DAPT 1–4 weeks</b>, then <b>clopidogrel alone up to 6 months</b>, plus <b>DOAC</b>.','ESC 2024: early aspirin discontinuation (≤1 week).')}
${RE('2a','B-R','Continue aspirin + clopidogrel <b>up to 1 month</b> if high thrombotic and low bleeding risk.')}
${RE('2b','B-R','Low atherothrombotic risk: stop antiplatelet and continue <b>DOAC alone 1 year after PCI</b>.')}
${RE('2b','C-LD','<b>DOAC monotherapy</b> if no acute indication for antiplatelet therapy.')}
<h4>Low-dose DOAC</h4>
${RE('2a','B-R','High ischemic risk, low–moderate bleeding risk, no other indication: add <b>rivaroxaban 2.5 mg twice daily</b> to aspirin 81 mg.')}
<h4>DAPT and PPI</h4>
${RE('2a','B-R','On DAPT, a <b>PPI</b> reduces GI bleeding risk.')}
<h3>8) Figure 9: antiplatelet durations (summary)</h3>
${T(['Situation','Month 0–1','Up to 6 mo','Up to 12 mo','>12 mo'],[
['<b>No OAC</b> — no PCI or &gt;12 mo from ACS','Aspirin','Aspirin','Aspirin','Aspirin'],['<b>No OAC</b> — prior ACS ± PCI','DAPT','DAPT','DAPT','May extend DAPT 12–36 mo (2b)'],['<b>No OAC</b> — PCI, low/moderate risk','DAPT','DAPT to 6 mo','SAPT','SAPT'],['<b>No OAC</b> — PCI, high bleeding risk','DAPT 1–3 mo','P2Y12 mono','P2Y12','SAPT'],['<b>OAC</b> — PCI, low/moderate risk','DOAC + clopidogrel + aspirin (≤1 mo)','DOAC + clopidogrel','DOAC alone','DOAC alone'],['<b>OAC</b> — PCI, high ischemic risk','DOAC + clopidogrel + aspirin (1 mo)','DOAC + clopidogrel (1–6 mo)','DOAC','DOAC'],['<b>OAC</b> — no PCI','DOAC alone','DOAC alone','DOAC alone','DOAC alone']
],'small')}
<h2 class="part">Part 3: Other preventive drugs</h2>
<h3>9) Beta-blockers (prevention, not symptoms)</h3>
${RE('1','A','<b>LVEF ≤40%</b> ± previous MI: BB reduces MACE including CV death.')}
${RE('1','A','<b>LVEF &lt;50%</b>: use <b>metoprolol succinate, carvedilol, or bisoprolol</b> titrated to target doses.')}
${RE('2b','B-NR','BB started for prior MI without LVEF ≤50%, angina, arrhythmia or uncontrolled HTN: reassess need beyond <b>1 year</b>.')}
${RE('3NB','B-NR','<b>No prior MI and LVEF &gt;50%</b>: BB does not reduce MACE without another indication.')}
${BOX('mem','HF-proven trio','<b>MCB</b>: <b>M</b>etoprolol succinate (not tartrate) – <b>C</b>arvedilol – <b>B</b>isoprolol.')}
<h3>10) RAAS inhibitors</h3>
${RE('1','A','CCD with <b>hypertension, diabetes, LVEF ≤40%, or CKD</b>: ACEi (or ARB if intolerant).')}
${RE('2b','B-R','Without HTN, DM, CKD and LVEF &gt;40%: ACEi/ARB may be considered.')}
${BOX('mem','When is ACEi class 1?','<b>“HDL-C”</b>: <b>H</b>TN – <b>D</b>iabetes – <b>L</b>VEF ≤40% – <b>C</b>KD.')}
<h3>11) Colchicine</h3>
${RE('2b','B-R','<b>Colchicine</b> for secondary prevention may be considered.','Anti-inflammatory — recall inflammation drives atherosclerosis.')}
${BOX('sum','Chapter summary','<ul><li>High-intensity statin for all (Atorva 40–80 / Rosuva 20–40).</li><li>2026 goals: &lt;70/&lt;100 generally; &lt;55/&lt;85 very high risk.</li><li>Very high risk = ≥2 major events or 1 + ≥2 conditions.</li><li>Aspirin 81 without OAC; DAPT 6 months after elective PCI.</li><li>OAC + PCI: DAPT 1–4 wk → clopidogrel to 6 mo + DOAC → DOAC alone after 1 year.</li><li>Forbidden: chronic NSAIDs; prasugrel/vorapaxar after stroke.</li><li>BB reduces MACE only with LVEF ≤40% (or recent MI); ACEi with HTN/DM/LVEF≤40%/CKD.</li></ul>')}
`});

/* ===== CH8 ===== */
CHAPTERS_EN.push({id:8,icon:'🩸',title:'HTN, Diabetes, CKD, Obesity & Heart Failure',en:'الضغط والسكري والكلى والسمنة وفشل القلب',mins:16,
body:`
<div class="author">Your real patient won’t have one disease: angina + hypertension + diabetes + maybe HF. Your skill is choosing drugs that <b>serve several conditions at once</b> while avoiding <b>harmful duplication</b> and <b>contraindications</b>.</div>
<h3>1) Blood pressure</h3>
${RE('1','A','Nonpharmacologic strategies first-line for <b>elevated BP (120–129/&lt;80)</b>.')}
${RE('1','B-R','BP target <b>&lt;130/&lt;80 mm Hg</b>.')}
${RE('1','B-R','HTN (≥130 and/or ≥80): <b>ACEi, ARB, or BB</b> first-line for compelling indications (recent MI, angina), adding <b>DHP CCB, long-acting thiazide, and/or MRA</b> as needed.')}
<div class="cards2"><div class="mini g"><b>First-line (compelling)</b><span>ACEi / ARB / Beta-blocker</span></div><div class="mini b"><b>Add-ons</b><span>DHP CCB · long-acting thiazide · MRA</span></div></div>
<h3>2) Diabetes: SGLT2i & GLP-1 RA</h3>
${RE('1','A','CCD + <b>type 2 diabetes</b>: an <b>SGLT2i or GLP-1 RA</b> with proven CV benefit reduces MACE.')}
${RE('1','B-NR','<b>Cost value:</b> GLP-1 RA = <b>high value</b>; SGLT2i = <b>intermediate value</b> (US prices).')}
<p>Target <b>HbA1c ≤7%</b> (Pharmacotherapy algorithm) with tailored diet and lifestyle.</p>
<h3>3) Concomitant heart failure</h3>
${RE('1','A','HF with <b>LVEF ≤40%</b>: <b>SGLT2i</b> reduces CV death and HF hospitalization, <b>irrespective of diabetes</b>.')}
${RE('2a','B-R','HF with <b>LVEF &gt;40%</b>: SGLT2i can reduce HF hospitalization and improve QOL.')}
<h3>4) CKD and obesity</h3>
<ul class="nice"><li><b>CKD</b> → ACEi (or ARB) <span class="pill c1">1</span>.</li><li><b>Obesity</b> → counseling, then <b>GLP-1 RA</b> (semaglutide preferred), then bariatric surgery; avoid sympathomimetic weight-loss drugs (3: Harm).</li></ul>
<h3>5) Safe integration — do / don’t</h3>
${T(['Situation','✅ Right','⛔ Wrong / why'],[
['Angina + <b>HFrEF</b>','HF-proven BB (MCB) + ACEi/ARB + SGLT2i; for symptoms amlodipine or nitrate','<b>Verapamil/diltiazem</b> depress contractility; verapamil contraindicated in HF'],
['Angina + uncontrolled HTN','BB, then add <b>DHP CCB</b>','Nitrate alone does not treat BP'],
['Angina + bradycardia/AV block','DHP CCB, nitrate, ranolazine','BB or verapamil/diltiazem'],
['BB + CCB together','BB + <b>DHP</b> = great combo (BB blunts reflex tachycardia)','BB + <b>non-DHP</b> → severe bradycardia/AV block'],
['Angina + diabetes','SGLT2i or GLP-1 RA + ACEi + statin','BB may mask hypoglycemia (glucose intolerance)'],
['Angina + asthma','CCB as alternative first-line','Non-selective BB (relative CI)'],
['Patient using sildenafil','Avoid nitrates or respect washout','Nitrate + PDE5i → severe hypotension (3: Harm)'],
['Ivabradine','—','Not with non-DHP CCB or strong CYP3A4 inhibitors'],
['Ranolazine + metformin','Metformin ≤1700 mg/day with ranolazine 1000 mg bid','OCT2 inhibition ↑ metformin'],
['Ranolazine + simvastatin','Simvastatin ≤20 mg','Ranolazine ↓ CYP3A metabolism']
],'small')}
${BOX('sum','Chapter summary','<ul><li>BP target &lt;130/80; ACEi/ARB/BB first then DHP CCB/thiazide/MRA.</li><li>Diabetes → SGLT2i or GLP-1 RA (1, A).</li><li>HFrEF → SGLT2i (1, A) regardless of diabetes; HFpEF → 2a.</li><li>Avoid non-DHP CCB in HFrEF; avoid BB + non-DHP.</li></ul>')}
`});

/* ===== CH9 ===== */
CHAPTERS_EN.push({id:9,icon:'⚕️',title:'Antianginal Therapy: BB, CCB, Nitrates & Ranolazine',en:'أدوية الذبحة',mins:30,
body:`
<div class="author">The pharmacist’s chapter: mechanisms, doses, adverse effects, contraindications, interactions. Link each drug to the supply/demand balance of Chapter 2 and most facts become <b>deducible</b>.</div>
<h3>1) Recommendations for symptom relief</h3>
${RE('1','B-R','A <b>beta blocker, CCB, or long-acting nitrate</b> for relief of angina.','⚠️ ESC 2024: nitrates are <b>not</b> first-line.')}
${RE('1','B-R','Still symptomatic: add a <b>second agent from a different class</b>.')}
${RE('1','B-R','<b>Ranolazine</b> if symptomatic despite BB, CCB or long-acting nitrate.')}
${RE('1','B-NR','<b>SL nitroglycerin or NTG spray</b> for immediate relief.')}
${RE('3H','B-R','<b>Normal LV function</b>: adding <b>ivabradine</b> is potentially harmful.')}
${RE('2b','B-R','Refractory angina, no other options: <b>EECP</b> may be considered.')}
<h3>2) Acute attack ⚡</h3>
${BOX('key','SL Nitroglycerin (GTN)','<ul><li><b>Tablet:</b> 200–400 mcg (½–1 tablet) every <b>3–4 min</b> until pain resolves, max <b>2–3 tablets over 15 min</b>.</li><li><b>Spray:</b> 400–800 mcg (1–2 sprays).</li><li><b>Prophylaxis:</b> <b>2–5 min</b> before a known trigger; effect ~<b>30 min</b>.</li><li><b>SL isosorbide dinitrate:</b> longer half-life, effect up to <b>2 h</b>.</li></ul>')}
<p><b>Every</b> patient with angina should carry SL NTG tablets or spray. Nitrates are the first step for acute attacks if infrequent (a few per month) or for prophylaxis before triggering activities.</p>
<h3>3) Beta-blockers</h3>
<div class="drug"><div class="dr"><span>Mechanism</span><p>↓O₂ demand via ↓<b>HR, contractility, BP</b> (longer diastole → better perfusion).</p></div><div class="dr"><span>Place</span><p><b>First-line</b> in all patients without contraindications.</p></div><div class="dr"><span>Dosing</span><p>Atenolol 25–200 mg qd · Metoprolol tartrate 100–450 mg/day in 2–3 doses · Propranolol 80–320 mg/day in 2–4 doses (LA: 80–320 qd)</p></div><div class="dr"><span>ADRs</span><p>Bradycardia, hypotension, <b>glucose intolerance</b>, fatigue, exercise intolerance, worsening claudication</p></div><div class="dr"><span>Absolute CI</span><p>Severe bradycardia, sick sinus syndrome, AV block, <b>unstable</b> HF</p></div><div class="dr"><span>Relative CI</span><p>Asthma, depression, peripheral vascular disease</p></div></div>
${BOX('tip','Practical target','Titrate to a suitable resting HR (often 55–60 bpm) as tolerated. <b>Never stop abruptly</b> — rebound ischemia.')}
<h3>4) Calcium channel blockers</h3>
<div class="drug"><div class="dr"><span>Mechanism</span><p>Dilate systemic and coronary arteries → ↑coronary flow, ↓O₂ consumption. Non-DHPs also ↓HR and contractility.</p></div><div class="dr"><span>Place</span><p>First-line if BB contraindicated, intolerable ADRs or inadequate control on BB. <b>Preferred in vasospastic angina</b>.</p></div><div class="dr"><span>Dosing</span><p><b>Amlodipine</b> 5–10 mg/d (5 in elderly) · <b>Diltiazem</b> ER cap 120–180 qd (max 480), ER tab 180–360, IR 180–360 divided · <b>Felodipine</b> 2.5–10 qd · <b>Nifedipine</b> IR 10–30 tid, SR 30–60 qd · <b>Verapamil</b> 240–480/d in 3–4 doses (40 mg tid elderly/small frame)</p></div><div class="dr"><span>ADRs</span><p>Bradycardia, hypotension, <b>constipation</b> (verapamil), worsening HF, <b>peripheral edema</b> (DHP), QT prolongation (bepridil), AV block (verapamil, diltiazem), excessive HR rise (nifedipine)</p></div><div class="dr"><span>Interaction</span><p><b>Digoxin</b> (↑ levels with verapamil/diltiazem)</p></div><div class="dr"><span>CI</span><p><b>DHP:</b> hypersensitivity. <b>Non-DHP:</b> acute MI with pulmonary congestion, WPW, AV block, symptomatic hypotension, sick sinus, cardiogenic shock, HF (verapamil)</p></div></div>
${T(['','DHP (amlodipine, nifedipine, felodipine)','Non-DHP (verapamil, diltiazem)'],[['Main effect','Potent vasodilation','Cardiac: ↓HR, ↓contractility'],['Heart rate','↑ reflex tachycardia (esp. IR nifedipine)','↓ bradycardia'],['Signature ADR','Ankle edema, headache, flushing','Constipation, AV block'],['With BB','✅ excellent combo','⛔ bradycardia/block'],['In HFrEF','Amlodipine is safe','⛔ avoid']],'small')}
<h3>5) Nitrates</h3>
<div class="drug"><div class="dr"><span>Mechanism</span><p>Venodilation (mainly) + arterial dilation → ↓<b>preload</b> → ↓wall tension → ↓O₂ demand (via NO → ↑cGMP).</p></div><div class="dr"><span>Place</span><p>Angina without compelling indications for other agents, or adjunct therapy.</p></div><div class="dr"><span>ISDN</span><p>Oral IR 5–40 mg qid · SR 40 mg q8–12h · SL 2.5–5 mg q5–10 min (max 3 doses in 15–30 min); prophylaxis 15 min before activity</p></div><div class="dr"><span>ISMN</span><p>Regular 5–20 mg bid ≥12 h apart · ER 30–60 mg in the morning, titrate every 3 days to max 240 mg · spray 0.4 mg q5 min (max 3 in 15 min)</p></div><div class="dr"><span>ADRs</span><p>Throbbing <b>headache</b>, dizziness, hypotension, flushing, reflex tachycardia, syncope; rare <b>methemoglobinemia</b></p></div><div class="dr"><span>CI</span><p>Hypersensitivity, <b>PDE5 inhibitors</b>, raised intracranial pressure, symptomatic hypotension. Caution: SBP &lt;90 or HR &lt;50</p></div></div>
<h4>🔁 Nitrate tolerance</h4>
<ul class="nice"><li>History: “<b>Monday disease</b>” in munitions workers; chronic tolerance and withdrawal deaths.</li><li><b>Proposed mechanisms:</b> ↓cGMP production, ↑cGMP phosphodiesterase, sulfhydryl (cysteine) depletion by peroxynitrite, neurohormonal activation, ↑intravascular volume.</li><li><b>Solution:</b> avoid around-the-clock dosing — <b>8–12 h nitrate-free interval</b> (beware rebound/silent ischemia in that window); acetylcysteine (sulfhydryl donor); ACEi, carvedilol or hydralazine.</li></ul>
<h4>💥 Dangerous interactions</h4>
${T(['Drug','Problem','Washout'],[['Sildenafil','PDE5i prevents cGMP breakdown → severe hypotension','24 h'],['Vardenafil','Same','24 h'],['Tadalafil','Same (long half-life)','<b>48 h</b>'],['Heparin','Heparin resistance with IV NTG &gt;350 mcg/min','—']])}
<h4>📦 Nitrate preparations</h4>
${T(['Preparation','Notes'],[['IV infusion','Acute hospital settings'],['SR tablets/capsules','<b>Most stable patients</b>: cheap, 2–3×/day, allow nitrate-free period; extensive first-pass'],['Transdermal patches','Expensive, inflexible dosing, may not allow free period'],['Ointments','Messy!'],['Adhesive buccal tablets','Expensive, no real advantage'],['SL tablets & sprays','Rapid onset, bypass liver — <b>acute attacks & prevention</b>']])}
<p>Three groups: <b>glyceryl trinitrate</b>, <b>isosorbide dinitrate</b> (metabolized to mononitrate), <b>isosorbide mononitrate</b>.</p>
<h3>6) Ranolazine</h3>
<div class="drug"><div class="dr"><span>Mechanism</span><p>Inhibits the <b>late inward sodium current (late I<sub>Na</sub>)</b></p></div><div class="dr"><span>Place</span><p>Combination with amlodipine, nitrates or BB when monotherapy fails. <b>Minimal HR/BP effect</b>.</p></div><div class="dr"><span>Dose</span><p>Start <b>500 mg bid</b> → max <b>1000 mg bid</b></p></div><div class="dr"><span>ADRs</span><p>Dizziness, headache, constipation, nausea, <b>torsades de pointes</b></p></div><div class="dr"><span>CI</span><p>Severe hepatic dysfunction, QT prolongation or QT-prolonging drugs, strong CYP3A inhibitors</p></div></div>
<h4>How does it work?</h4>
<div class="flow"><div class="fs">Ischemia</div><div class="arr">⬇</div><div class="fs">↑ Late I<sub>Na</sub></div><div class="arr">⬇</div><div class="fs">Na⁺ overload → Ca²⁺ overload</div><div class="arr">⬇</div><div class="fs">Diastolic relaxation failure (↑diastolic tension, LV stiffness)</div><div class="arr">⬇</div><div class="fs o">Extravascular compression → ↓perfusion → more ischemia (vicious cycle)</div></div>
<p class="center"><b>Ranolazine breaks the cycle.</b> Late I<sub>Na</sub> dysfunction causes <b>mechanical</b> (abnormal contraction/relaxation), <b>metabolic</b> (↑ATP use, ↓ATP formation) and <b>electrical</b> (EADs, VT) consequences.</p>
<h4>Ranolazine contraindications & precautions</h4>
${T(['Contraindications','Precautions'],[
['<b>Liver cirrhosis</b>: ↑concentration 30–80% → QT risk','Moderate CYP3A4 inhibitors (diltiazem, verapamil, grapefruit, erythromycin, fluconazole) ↑levels (2-fold with diltiazem/verapamil)'],
['<b>Strong CYP3A4 inhibitors</b> (ketoconazole, clarithromycin, nelfinavir): 3.2-fold with ketoconazole','Pre-existing QT prolongation, torsades history, other QT drugs'],
['<b>CYP3A4 inducers</b> (rifampin, phenobarbital, phenytoin, carbamazepine, St John’s wort): ↓efficacy (95% with rifampin)','P-gp inhibitors (cyclosporine) ↑absorption up to 50%'],
['','Renal impairment ↑ levels'],['','↑ P-gp substrates: <b>digoxin ×1.5</b>'],['','↓ metabolism of CYP2D6 substrates'],['','OCT2: <b>metformin ≤1700 mg/day</b> with ranolazine 1000 mg bid'],['','CYP3A substrates: <b>simvastatin ≤20 mg</b>']
],'small')}
<h3>7) Novel antianginal agents</h3>
${T(['Drug','Mechanism','Key facts'],[
['<b>Ivabradine</b>','Inhibits <b>I<sub>f</sub></b> (“funny”) current in SA node → ↓HR only','Non-inferior to atenolol/amlodipine (7.5–10 mg bid); ASSOCIATE trial with atenolol. ADRs: bradycardia, <b>phosphenes</b>, headache, blurred vision. ESC 2024: <b>not recommended</b> add-on if LVEF &gt;40% without HF. Not with non-DHP CCB or strong CYP3A4 inhibitors'],
['<b>Nicorandil</b>','Opens ATP-sensitive K⁺ channels + nitrate moiety','<b>IONA</b> trial: 17% ↓ in events → possible cardioprotection'],
['<b>Trimetazidine</b>','Metabolic modulator: ↓fatty-acid β-oxidation → glucose use (less O₂)','<b>TACT</b> trial: with nitrates/BB improved exercise, fewer attacks'],
['<b>Fasudil</b>','<b>Rho-kinase</b> inhibitor','↑ time to &gt;1 mm ST depression, ↑ exercise duration; <b>no effect on HR/BP</b>']
],'small')}
${BOX('mem','Novel agents mnemonic','<b>“I Need To Fly”</b>: <b>I</b>vabradine (I<sub>f</sub>) · <b>N</b>icorandil (K<sub>ATP</sub>) · <b>T</b>rimetazidine (metabolic) · <b>F</b>asudil (Rho kinase) + ranolazine (late Na).')}
${BOX('sum','Chapter summary','<ul><li>BB first-line; CCB alternative/add-on (best in vasospasm); nitrates not first-line per ESC 2024.</li><li>SL NTG q3–4 min, max 2–3 in 15 min.</li><li>Nitrate tolerance → 8–12 h free interval.</li><li>PDE5i: 24 h sildenafil/vardenafil, 48 h tadalafil.</li><li>Ranolazine: late Na, 500–1000 mg bid, QT, CYP3A4, metformin ≤1700, simva ≤20.</li><li>Ivabradine with normal LV = 3: Harm.</li></ul>')}
`});

CHAPTERS_EN.push({id:10,icon:'🏥',title:'Revascularization: PCI vs CABG & Follow-up',en:'إعادة التروية والمتابعة',mins:15,
body:`
<div class="author">Many stable angina patients do well on drugs alone. When do we need “plumbing”, and which is better — a stent or bypass surgery? Let’s settle it.</div>
<h3>1) Indications for revascularization</h3>
<ol class="nice"><li><b>Lifestyle-limiting angina</b> despite GDMT.</li><li>High-risk anatomy or patients in whom revascularization improves <b>survival</b>.</li><li>PCI vs CABG depends on anatomy, complexity, LVEF, diabetes, surgical risk and preferences.</li></ol>
${T(['Clinical situation','Preferred approach'],[['Persistent angina despite GDMT','PCI or CABG to relieve symptoms'],['Significant left main with complex anatomy','<b>CABG preferred</b>'],['Multivessel CAD with LVEF ≤35%','CABG improves survival in suitable candidates'],['Diabetes + multivessel CAD involving LAD','<b>CABG generally preferred</b>'],['Complex/diffuse (SYNTAX &gt;33)','CABG generally favored'],['Focal CAD, suitable anatomy','PCI frequently appropriate']])}
<h3>2) Guideline recommendations</h3>
${RE('1','A','Lifestyle-limiting angina despite GDMT with suitable stenoses: revascularization to <b>improve symptoms</b>.')}
${RE('1','B-R','Significant <b>left main</b> or <b>multivessel disease with LVEF ≤35%</b>: <b>CABG</b> + medical therapy to <b>improve survival</b>.')}
${RE('2a','B-R','Multivessel CAD suitable for CABG or PCI: revascularization + GDMT to lower MI, urgent revascularization or cardiac death.')}
${RE('2a','B-NR','Selected left main stenosis where PCI equals CABG: PCI reasonable to improve survival.')}
<h4>PCI vs CABG</h4>
${RE('1','B-R','Left main + <b>high-complexity</b> CAD: <b>CABG over PCI</b>.')}
${RE('2a','B-R','Complex diffuse multivessel CAD (<b>SYNTAX &gt;33</b>): CABG reasonable over PCI.')}
${RE('2a','B-NR','<b>Poor surgical candidates</b>: PCI reasonable over CABG.')}
${RE('1','A','<b>Diabetes + multivessel CAD involving LAD</b>: <b>CABG (LIMA to LAD)</b> over PCI.')}
${RE('2b','B-R','Diabetes with left main and SYNTAX ≤33: PCI may be considered.')}
<h3>3) CABG</h3>
<ul class="nice"><li>Grafts bypass stenosed native coronaries.</li><li>Grafts: <b>saphenous vein</b>, or arteries — <b>left internal mammary artery (LIMA)</b>, <b>radial artery</b>.</li><li>Vein segments are sutured from the <b>ascending aorta</b> to the coronary <b>distal</b> to the stenosis.</li></ul>
${BOX('key','Post-CABG secondary prevention','<ul><li>Long-term aspirin unless contraindicated.</li><li>High-intensity or maximally tolerated statin; add non-statin when needed.</li><li>LDL-C: <b>&lt;55</b> very high risk (ACC/AHA 2026); <b>&lt;70</b> other ASCVD (lower reasonable in some).</li><li>Control HTN and diabetes, stop smoking, cardiac rehab.</li><li>DAPT after CABG may reduce vein graft occlusion (2b).</li></ul>')}
<h3>4) PCI</h3>
<ul class="nice"><li>Catheter-based treatment of significant stenoses.</li><li>Balloon angioplasty + usually a <b>drug-eluting stent (DES)</b>.</li><li>DES release antiproliferatives (<b>paclitaxel</b> or <b>sirolimus</b>) locally to inhibit <b>restenosis</b>.</li><li><b>Radial access</b> preferred — less bleeding and vascular complications.</li></ul>
${BOX('warn','Important considerations','<ul><li><b>PCI relieves angina but does not improve survival in every stable CAD patient.</b></li><li>Complications: bleeding, restenosis, <b>stent thrombosis</b>, contrast kidney injury.</li><li>After elective PCI: aspirin + clopidogrel for <b>6 months</b> (shorter if high bleeding risk).</li><li><b>Continue lifelong secondary prevention</b> even after successful PCI.</li></ul>')}
<h3>5) Evaluation of outcomes</h3>
${T(['Domain','What to assess'],[['<b>Angina symptoms</b>','Better exercise capacity, fewer symptoms at the same exertion, questionnaires; improvement over <b>2–4 weeks</b> and stable unless progression'],['<b>Cardiac performance</b>','Only if medical therapy fails or very high-risk patients'],['<b>Risk factors</b>','Assess and reassess (lipids 4–12 wk after statin change, BP, glucose, smoking)']])}
${BOX('sum','Chapter summary','<ul><li>PCI = mostly symptoms; CABG = survival in left main, multivessel with LVEF ≤35%, diabetes with LAD.</li><li>SYNTAX &gt;33 → CABG; high surgical risk → PCI.</li><li>DES: paclitaxel/sirolimus; radial access preferred.</li><li>Lifelong secondary prevention after any procedure.</li></ul>')}
`});

CHAPTERS_EN.push({id:11,icon:'⚡',title:'Vasospastic, Microvascular, Refractory & Silent Ischemia',en:'الحالات الخاصة',mins:10,
body:`
<div class="author">Examiners love these “special cases” because they break the general rules. The biggest broken rule: <b>beta-blockers</b> are usually first-line, but are <b>avoided</b> in vasospastic angina!</div>
<h3>1) Vasospastic (Prinzmetal / variant) angina</h3>
<div class="drug"><div class="dr"><span>Patient</span><p>Younger, fewer risk factors, <b>higher smoking rate</b>.</p></div><div class="dr"><span>Pain</span><p>At <b>rest</b>, <b>early morning</b>, cyclical & unpredictable, may remit spontaneously; not exertional, not relieved by rest.</p></div><div class="dr"><span>ECG</span><p>Transient <b>ST elevation</b>.</p></div><div class="dr"><span>Acute</span><p><b>Nitrates</b></p></div><div class="dr"><span>Chronic</span><p><b>Nitrates and CCBs</b> — <b>avoid BB</b></p></div><div class="dr"><span>Also</span><p>Risk factor assessment and aggressive lifestyle change (especially smoking)</p></div></div>
${BOX('exam','Why avoid BB in vasospasm?','Blocking vasodilating <b>β2</b> receptors leaves vasoconstricting <b>α</b> receptors unopposed → <b>worse spasm</b>.')}
<h3>2) Microvascular ischemia — ANOCA/INOCA</h3>
<p>Angina/ischemia with non-obstructed epicardial arteries due to microvascular dysfunction or spasm. Treat risk factors (statin, ACEi when indicated, lifestyle) and symptoms according to the dominant mechanism.</p>
<h3>3) Refractory angina</h3>
<ul class="nice"><li>Persistent angina despite BB + CCB + LA nitrates + ranolazine, and not suitable for revascularization.</li><li>Options: novel agents (nicorandil, trimetazidine, ivabradine within its limits…) and <b>EECP</b> <span class="pill c2b">2b</span>.</li></ul>
<h3>4) Silent ischemia</h3>
${T(['Item','Details'],[['<b>Occurrence</b>','Up to <b>80%</b> of ischemic episodes in CAD; associated with extent of disease'],['<b>Classification</b>','<b>Class I:</b> never experience angina · <b>Class II:</b> both symptomatic and asymptomatic episodes'],['<b>Treatment</b>','<b>BB first-line</b>; CCB acceptable substitute but less benefit with the <b>diurnal (morning) surge</b>; <b>combination</b> often superior'],['<b>Detection</b>','Continuous Holter recording; common in diabetics']])}
${BOX('sum','Chapter summary','<ul><li>Vasospastic: young smokers, morning rest pain, ST elevation, nitrates + CCB, <b>no BB</b>.</li><li>Silent: up to 80%, BB first, combination better.</li><li>Refractory: EECP (2b) + novel agents.</li></ul>')}

body:`
<div class="author">⚠️ <b>Important:</b> the supplementary (self-reading) material is an <b>essential, examinable</b> part of the lecture, covering pathophysiology, pharmacology and patient education. Don’t skip it! Pathophysiology and pharmacology are in Chapters 2 and 9; here we focus on <b>counseling</b>.</div>
<h3>1) Counseling on SL nitroglycerin tablets</h3>
<div class="counsel"><div class="cs"><b>1</b><span><b>Sit</b> (or lie) down before use — it may cause dizziness. <small>(Another slide: sit rather than lie or stand.)</small></span></div><div class="cs"><b>2</b><span>Place <b>½–1 tablet under the tongue</b>; <b>do not swallow</b>. Once pain is relieved, spit out or swallow the rest to avoid headache.</span></div><div class="cs"><b>3</b><span>Repeat every 3–4 min. <b>Call an ambulance</b> if 2–3 tablets over 15 minutes do not relieve pain. <small>(The education table is stricter: call if the first tablet does not relieve pain — most episodes resolve within 5–10 min with rest and one tablet.)</small></span></div><div class="cs"><b>4</b><span>Keep in the <b>original dark glass bottle</b>, away from moisture, heat and light; <b>don’t carry close to the body</b>.</span></div><div class="cs"><b>5</b><span>Write the <b>opening date</b> on the bottle.</span></div><div class="cs"><b>6</b><span><b>Never</b> take sildenafil, tadalafil or vardenafil.</span></div><div class="cs"><b>7</b><span>Common ADRs: headache, flushing, palpitations, orthostatic hypotension, fainting, peripheral edema.</span></div></div>
${BOX('warn','Conflicting numbers in the reference!','The counseling slide says discard unused tablets <b>3 months</b> after opening, while the education table says tablets are good for <b>6 months</b> after opening and the <b>spray 3 years</b>. Follow the wording of the exam question and the lecturer’s emphasis.')}
<h3>2) Education table for SL NTG</h3>
${T(['Education point','Purpose'],[['Keep in original dark glass container','Degraded by sunlight'],['Don’t put in a regular (plastic) bottle','Interacts with plastic, loses potency'],['Don’t dispense in a large plastic vial with safety cap','Patient shouldn’t struggle with the cap during an attack'],['Don’t store in the bathroom','Moisture degrades tablets'],['Keep it with you at all times; may need several vials','Useless if not available — home, work, car…'],['Sit down and rest when taking it','Small tablet, but not a small dose: flushing, headache, light-headedness'],['Describe how to use a SL tablet','Fast onset depends on avoiding GI transit and first-pass; keep under tongue until dissolved'],['Refill tablets every 6 months, spray every 3 years','Unstable once opened — refill even if not used up'],['Remove the cotton plug','Don’t struggle with it during an attack'],['How to use prophylactically','Before an exertional event known to cause angina'],['Call emergency if the first SL NTG does not relieve angina','May be ACS, not stable IHD — needs rapid care']],'small')}
<h3>3) Counseling on isosorbide mononitrate</h3>
<ul class="nice"><li>Start <b>30–60 mg once daily</b>, up to <b>120 mg once daily</b> if needed.</li><li><b>Twice-daily dosing is not recommended</b> — no nitrate-free interval → tolerance.</li><li><b>Swallow whole</b>; do not crush or chew.</li><li>Take when angina is most frequent: <b>night</b> for nocturnal angina, <b>morning</b> for daytime angina.</li><li><b>Not for acute attacks</b> (slow onset).</li><li><b>Do not cut Imtrate®</b> in half; other products can be halved.</li></ul>
${BOX('tip','See the logic','A single morning ER dose gives daytime coverage plus a nitrate-free night — the practical solution to tolerance.')}
<h3>4) Individualized patient education</h3>
<ol class="nice" type="a"><li>Importance of adherence for symptoms and slowing disease progression.</li><li>Explain medications and risk reduction respecting understanding, literacy and culture.</li><li>Comprehensive review of all therapeutic options.</li><li>Appropriate exercise levels; encourage daily activity.</li><li>Self-monitoring skills.</li><li>Recognize worsening symptoms and act appropriately.</li></ol>
<h4>Lifestyle elements influencing prognosis</h4>
<ul class="nice"><li>Weight control: <b>BMI 18.5–24.9</b>; waist <b>&lt;102 cm</b> men, <b>&lt;88 cm</b> women.</li><li>Lipid management and BP control.</li><li>Smoking cessation and avoiding secondhand smoke.</li><li>Individualized nutrition/lifestyle changes for diabetes.</li><li>Reasonable to educate on: diet low in saturated fat, cholesterol and trans fat, high in fruit, whole grains and vegetables, reduced sodium with cultural preferences; symptoms of stress and depression; behavioral approaches; evaluation and treatment of major depression when indicated.</li></ul>
<h3>5) Model counseling dialogue</h3>
<div class="dialog"><p><b>👨‍⚕️ Pharmacist:</b> This is sublingual nitroglycerin. When you feel your usual chest pain, sit down first, then put one tablet under your tongue and let it dissolve without swallowing.</p><p><b>🧓 Patient:</b> And if the pain doesn’t go away?</p><p><b>👨‍⚕️ Pharmacist:</b> If it isn’t better 5 minutes after the first tablet, call an ambulance right away. You may take another tablet every 3–4 minutes, up to 3 tablets in 15 minutes.</p><p><b>🧓 Patient:</b> Where do I keep it?</p><p><b>👨‍⚕️ Pharmacist:</b> In this same glass bottle, away from the bathroom and heat. Always carry it, but not in a pocket against your body. Write the opening date and replace it on time even if it’s not finished. And remember: never use erectile-dysfunction drugs like Viagra with this medicine.</p></div>
${BOX('sum','Chapter summary','<ul><li>SL NTG: sit, under tongue, q3–4 min up to 3 in 15 min, ambulance if not better.</li><li>Original glass bottle, no bathroom, no plastic, remove cotton, write opening date.</li><li>ISMN ER: once daily in the morning, swallow whole, not for attacks, don’t cut Imtrate.</li><li>BMI 18.5–24.9; waist &lt;102 men / &lt;88 women.</li></ul>')}
`});

function srch(v){v=v.trim();if(v.length<2){$('#sr').innerHTML='';return}const lv=v.toLowerCase(),esc=v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let out=[];
 IDX.forEach(c=>{let i=c.x.toLowerCase().indexOf(lv),n=0;while(i>=0&&n<3){const sn=c.x.slice(Math.max(0,i-50),i+v.length+60);out.push(`<div class="sr" onclick="window._hl='${v.replace(/'/g,'')}';go('#/ch/${c.id}')"><b>${L('الفصل','Chapter')} ${c.id}: ${c.t}</b><div class="small">…${sn.replace(new RegExp(esc,'gi'),m=>`<mark>${m}</mark>`)}…</div></div>`);i=c.x.toLowerCase().indexOf(lv,i+v.length);n++}});
 GLOSS.forEach(g=>{if(g.join(' ').toLowerCase().includes(lv))out.push(`<div class="sr" onclick="go('#/gloss')"><b>🔤 ${g[0]}</b> — ${g[1]} · ${g[2]}</div>`)});
 $('#sr').innerHTML=out.join('')||`<p class="small">${L('لا نتائج','No results')}</p>`}
