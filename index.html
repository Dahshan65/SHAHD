<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3123b">
<title>IHD — Stable Ischemic Heart Disease</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#f6f3f1;--card:#fff;--ink:#1d1a22;--mute:#6b6470;--line:#e8e1dd;--pri:#b3123b;--pri2:#7d0c2a;--navy:#14223f;--acc:#e5a823;--ok:#1d8a5a;--fs:16px;
--c1:#1f8f4e;--c2a:#d9a400;--c2b:#e27b13;--c3NB:#c4531b;--c3H:#c0182c}
body.dark{--bg:#0f1117;--card:#191c25;--ink:#ecebf0;--mute:#a19ead;--line:#2a2e3a;--navy:#0b1426}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.85;padding-bottom:78px;transition:background .3s}
e{unicode-bidi:isolate;direction:ltr;font-family:'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;color:var(--pri)}
body.dark e{color:#ff7b98}
.ltr,[dir=ltr]{text-align:left;font-family:'Segoe UI',Roboto,Arial,sans-serif}
/* Top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pri2),var(--pri) 55%,#d23a5c);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(125,12,42,.25)}
.top h1{font-size:17px;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.prog{height:4px;background:rgba(255,255,255,.25);position:absolute;bottom:0;left:0;right:0}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
main{max-width:860px;margin:0 auto;padding:14px}
/* Bottom nav */
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
nav.bot a{flex:1;text-align:center;padding:8px 0 10px;color:var(--mute);text-decoration:none;font-size:11.5px;font-weight:700}
nav.bot a span{display:block;font-size:21px;line-height:1.3}
nav.bot a.on{color:var(--pri)}
/* Hero */
.hero{background:radial-gradient(circle at 15% 20%,#ff5a7c55,transparent 40%),linear-gradient(135deg,var(--navy),#2a1030 60%,var(--pri2));color:#fff;border-radius:24px;padding:22px 18px;position:relative;overflow:hidden;margin-bottom:16px}
.hero h2{margin:0 0 4px;font-size:23px;font-weight:900;line-height:1.4}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .ecg{position:absolute;left:0;right:0;bottom:6px;opacity:.35}
.hero .badge{display:inline-block;background:var(--acc);color:#2a1700;font-weight:800;font-size:12px;padding:2px 10px;border-radius:20px;margin-bottom:8px}
.ring{display:flex;align-items:center;gap:14px;margin-top:14px;position:relative;z-index:1}
.ring svg{width:70px;height:70px}
.ring small{display:block;opacity:.85}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.tile:active{transform:scale(.97)}
.tile:hover{box-shadow:0 8px 22px rgba(0,0,0,.07)}
.tile .ic{font-size:28px}
.tile b{display:block;font-size:14.5px;margin-top:4px;line-height:1.5}
.tile small{color:var(--mute);font-size:12px}
.sec-t{font-size:17px;font-weight:800;margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
.chap{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer}
.chap .num{min-width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.chap.done .num{background:linear-gradient(135deg,#1f8f4e,#13603a)}
.chap .tx{flex:1;min-width:0}
.chap .tx b{display:block;font-size:15px;line-height:1.5}
.chap .tx small{color:var(--mute);font-size:11.5px;direction:ltr;display:block;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .meta{font-size:11px;color:var(--mute);text-align:center}
/* Reader */
.reader{background:var(--card);border-radius:22px;padding:18px 16px;border:1px solid var(--line)}
.reader h2.ct{margin:0;font-size:21px;font-weight:900;color:var(--pri);line-height:1.5}
.reader .cen{direction:ltr;text-align:right;color:var(--mute);font-size:13px;margin-bottom:12px}
.reader h3{font-size:18px;margin:26px 0 8px;padding-right:12px;border-right:5px solid var(--pri);line-height:1.5}
.reader h4{font-size:16px;margin:16px 0 6px;color:var(--navy)}
body.dark .reader h4{color:#9fb6ff}
.reader h2.part{background:var(--navy);color:#fff;padding:8px 14px;border-radius:12px;font-size:16px;margin:26px 0 6px}
.reader p{margin:8px 0}
.hl{background:linear-gradient(transparent 55%,#ffd86a88 55%);font-weight:700}
body.dark .hl{background:linear-gradient(transparent 55%,#b58a1a88 55%)}
.author{background:linear-gradient(135deg,#fff5f7,#fff);border:1px dashed var(--pri);padding:12px 14px;border-radius:16px;position:relative;font-size:.95em}
body.dark .author{background:#24131a}
.author:before{content:'✍️ كلمة المؤلف';display:block;font-weight:800;color:var(--pri);font-size:13px;margin-bottom:2px}
ul.nice,ol.nice{padding-right:20px;margin:8px 0}
ul.nice li,ol.nice li{margin:5px 0}
.small{font-size:.88em;color:var(--mute)}
.center{text-align:center}
.refs{font-size:13px;color:var(--mute)}
/* boxes */
.box{border-radius:16px;padding:12px 14px;margin:14px 0;border:1px solid}
.box-h{font-weight:800;margin-bottom:4px}
.box ul{margin:4px 0;padding-right:18px}
.box.key{background:#eef4ff;border-color:#b9cdfb}.box.key .box-h{color:#1d4fb8}
.box.tip{background:#eefaf3;border-color:#b5e3c8}.box.tip .box-h{color:#167149}
.box.warn{background:#fff3f0;border-color:#f6c2b5}.box.warn .box-h{color:#b0301b}
.box.exam{background:#fff8e6;border-color:#f1d68b}.box.exam .box-h{color:#9a6b00}
.box.mem{background:#f6efff;border-color:#d8c3fb}.box.mem .box-h{color:#6a2fc2}
.box.sum{background:var(--navy);border-color:var(--navy);color:#fff}.box.sum .box-h{color:var(--acc)}
body.dark .box.key{background:#152036;border-color:#2c4170}body.dark .box.tip{background:#12261c;border-color:#245a3c}body.dark .box.warn{background:#2c1712;border-color:#6b3326}body.dark .box.exam{background:#2a2210;border-color:#6a5420}body.dark .box.mem{background:#211631;border-color:#4b3378}
/* rec */
.rec{border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.rec-h{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;color:#fff;font-size:12.5px;font-weight:800}
.rec-en{padding:8px 12px;font-size:14px;line-height:1.65}
.rec-ar{padding:0 12px 9px;font-size:13.5px;color:var(--mute)}
.rec .loe{background:rgba(255,255,255,.25);padding:0 8px;border-radius:8px;direction:ltr}
.rec.c1 .rec-h{background:var(--c1)}.rec.c2a .rec-h{background:var(--c2a)}.rec.c2b .rec-h{background:var(--c2b)}.rec.c3NB .rec-h{background:var(--c3NB)}.rec.c3H .rec-h{background:var(--c3H)}
.rec.c1{border-color:#9fd7b5}.rec.c2a{border-color:#f0dc8d}.rec.c2b{border-color:#f5c194}.rec.c3NB{border-color:#efb39a}.rec.c3H{border-color:#f0a3ad}
.pill{display:inline-block;padding:0 9px;border-radius:20px;color:#fff;font-size:12px;font-weight:800;direction:ltr;margin:1px}
.pill.c1{background:var(--c1)}.pill.c2a{background:var(--c2a)}.pill.c2b{background:var(--c2b)}.pill.c3NB{background:var(--c3NB)}.pill.c3H{background:var(--c3H)}
/* tables */
.tbl-wrap{overflow-x:auto;margin:10px 0;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
table.small{font-size:12.5px}
th{background:var(--navy);color:#fff;padding:8px;font-weight:700;text-align:right}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:rgba(179,18,59,.03)}
/* visual blocks */
.spectrum{display:flex;gap:6px;margin:10px 0}
.sp{flex:1;border-radius:14px;padding:10px 6px;text-align:center;color:#fff;font-size:13px}
.sp b{display:block;direction:ltr;font-size:13px}.sp small{font-size:11.5px;opacity:.95;line-height:1.5;display:block}
.sp.s1{background:#5b6b86}.sp.s2{background:#d38a12}.sp.s3{background:var(--c3H)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.stat{background:linear-gradient(135deg,var(--navy),#2d3b63);color:#fff;border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--acc);direction:ltr;text-align:right}
.stat span{font-size:12.5px;opacity:.92;line-height:1.5;display:block}
.balance{display:grid;grid-template-columns:1fr 40px 1fr;gap:6px;align-items:center;margin:12px 0}
.pan{border-radius:16px;padding:10px;font-size:13px}
.pan h5{margin:0 0 6px;font-size:13.5px;text-align:center;line-height:1.5}
.pan ul{margin:0;padding-right:16px}.pan li{margin:4px 0;direction:ltr;text-align:right;font-weight:700}.pan li small{font-weight:400;direction:rtl;display:block}
.pan.sup{background:#e8f6ee;border:2px solid #1f8f4e}.pan.dem{background:#fdecef;border:2px solid var(--pri)}
body.dark .pan.sup{background:#12261c}body.dark .pan.dem{background:#2a1219}
.fulcrum{font-size:30px;text-align:center}
.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.st{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px}
.st b{min-width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}
.cards3,.cards2{display:grid;gap:10px;margin:10px 0}
.cards3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.cards2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mini{border-radius:16px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.mini b{display:block;margin-bottom:4px}.mini span{font-size:13.5px}
.mini.g{border-color:#9fd7b5;background:#eefaf3}.mini.b{border-color:#b9cdfb;background:#eef4ff}
body.dark .mini.g{background:#12261c}body.dark .mini.b{background:#152036}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0;text-align:center}
.five div{background:var(--navy);color:#fff;border-radius:12px;padding:8px 2px;font-size:12px;direction:ltr;font-weight:700}
.five b{display:block;color:var(--acc);font-size:18px}.five small{display:block;direction:rtl;font-weight:400;opacity:.85}
.ccs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.cc{display:flex;gap:10px;border-radius:14px;padding:10px;align-items:flex-start;color:#fff}
.cc b{min-width:72px;direction:ltr;font-size:15px}.cc span{font-size:13.5px}
.cc.c1{background:#2c8f5a}.cc.c2{background:#c79a12}.cc.c3{background:#d9661b}.cc.c4{background:#c0182c}
.risk{display:flex;gap:8px;margin-top:10px}
.rk{flex:1;border-radius:14px;padding:10px;text-align:center;color:#fff}.rk b{display:block;font-size:20px;direction:ltr}
.rk.lo{background:var(--c1)}.rk.mid{background:var(--c2b)}.rk.hi{background:var(--c3H)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips span{background:var(--bg);border:1px solid var(--line);padding:3px 12px;border-radius:20px;font-size:13px}
.algo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.algo .col{display:flex;flex-direction:column;gap:6px}
.ah{background:var(--navy);color:#fff;font-weight:800;text-align:center;border-radius:12px;padding:6px}
.an{background:#eef4ff;border:1px solid #b9cdfb;border-radius:12px;padding:7px;font-size:12.5px;text-align:center;line-height:1.6}
.an.red{background:#fdecef;border-color:#f0a3ad;font-weight:800}
.ad{background:var(--acc);color:#2a1700;border-radius:30px;padding:5px;font-size:12.5px;text-align:center;font-weight:800}
body.dark .an{background:#152036;border-color:#2c4170}body.dark .an.red{background:#2a1219}
.food{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.fd{border-radius:16px;padding:10px 12px;font-size:13.5px}.fd ul{margin:4px 0;padding-right:18px}
.fd.ok{background:#e8f6ee;border:2px solid var(--c1)}.fd.mid{background:#fff8e1;border:2px solid var(--c2a)}.fd.no{background:#fdecef;border:2px solid var(--c3H)}
body.dark .fd.ok{background:#12261c}body.dark .fd.mid{background:#2a2210}body.dark .fd.no{background:#2a1219}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gl{border-radius:18px;padding:12px;text-align:center;background:linear-gradient(135deg,#2c8f5a,#1a6a40);color:#fff}
.gl.vh{background:linear-gradient(135deg,var(--pri),var(--pri2))}
.gl h5{margin:0 0 6px;font-size:13px;line-height:1.5}.gl b{display:block;font-size:20px;direction:ltr}.gl small{opacity:.85;font-size:11.5px}
.vhr{display:flex;align-items:center;gap:8px;margin:10px 0}
.vb{flex:1;background:var(--navy);color:#fff;border-radius:14px;padding:12px;text-align:center}.vb b{color:var(--acc);font-size:22px}
.or{font-weight:900;color:var(--pri)}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px;margin:12px 0}
.fs{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;font-size:13.5px;max-width:420px;width:100%}
.fs.g{background:#e8f6ee;border-color:var(--c1)}.fs.y{background:#fff8e1;border-color:var(--c2a)}.fs.o{background:#fff0e3;border-color:var(--c2b)}
body.dark .fs.g{background:#12261c}body.dark .fs.y{background:#2a2210}body.dark .fs.o{background:#2c1d10}
.arr{color:var(--mute);font-size:12px}
.drug{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0}
.dr{display:flex;border-top:1px solid var(--line)}.dr:first-child{border-top:0}
.dr span{min-width:96px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:8px;display:flex;align-items:center}
.dr p{margin:0;padding:8px 10px;font-size:13.5px}
.counsel{display:flex;flex-direction:column;gap:8px}
.cs{display:flex;gap:10px;align-items:flex-start;background:var(--bg);padding:9px;border-radius:14px}
.cs b{min-width:30px;height:30px;border-radius:10px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
.dialog{background:var(--bg);border-radius:16px;padding:10px 14px;border:1px solid var(--line)}
.dialog p{margin:6px 0}
/* reader nav */
.rnav{display:flex;gap:10px;margin:16px 0}
.btn{border:0;border-radius:14px;padding:11px 16px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;flex:1}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:13px;flex:0}
/* quiz */
.qcard{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.qtop{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:6px}
.qq{unicode-bidi:plaintext;text-align:start;font-size:16.5px;font-weight:700;line-height:1.6;font-family:'Segoe UI',Roboto,Arial,sans-serif}
.qq.ar{direction:rtl;text-align:right;font-family:inherit}
.opt{display:block;width:100%;unicode-bidi:plaintext;text-align:start;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;margin:8px 0;font-size:15px;cursor:pointer;font-family:'Segoe UI',Roboto,Arial,sans-serif}
.opt.ar{direction:rtl;text-align:right;font-family:inherit}
.opt.right{border-color:var(--ok);background:#e3f6ea;color:#0d4b2c}
.opt.wrong{border-color:var(--c3H);background:#fde7ea;color:#6b0d1a}
.exp{background:#fff8e6;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px;border:1px solid #f1d68b}
body.dark .exp{background:#2a2210;border-color:#6a5420}
.qbar{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}.qbar i{display:block;height:100%;background:var(--pri)}
.score{text-align:center;padding:18px}
.score .big{font-size:54px;font-weight:900;color:var(--pri);direction:ltr}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipsel button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.chipsel button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* flashcard */
.flash{perspective:1000px;height:230px;margin:10px 0;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.f .in{transform:rotateY(180deg)}
.flash .fa,.flash .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:19px;font-weight:800}
.flash .fa{background:linear-gradient(135deg,var(--navy),#2d3b63);color:#fff;direction:ltr}
.flash .fb{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transform:rotateY(180deg);font-size:17px}
/* tools */
.tool{background:var(--card);border-radius:20px;border:1px solid var(--line);padding:16px;margin-bottom:14px}
.tool h3{margin:0 0 4px;font-size:17px}
.tool label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14.5px}
.tool input[type=checkbox],.tool input[type=radio]{width:20px;height:20px;accent-color:var(--pri)}
.tool input[type=number],.tool select,.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{margin-top:12px;border-radius:14px;padding:12px;background:var(--navy);color:#fff;font-size:14.5px}
.res b{color:var(--acc)}
.disc{font-size:12px;color:var(--mute);margin-top:8px}
.timer{font-size:52px;font-weight:900;text-align:center;direction:ltr;color:var(--pri)}
/* glossary/search */
.gl-it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.gl-it b{color:var(--pri);direction:ltr;display:inline-block}.gl-it .en2{direction:ltr;text-align:right;font-size:13px;color:var(--mute)}
.sr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sr mark{background:#ffd86a;color:#000;border-radius:4px}
.about{text-align:center}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;border-radius:30px;padding:10px 20px;margin:6px}
.ig{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff;text-decoration:none;font-weight:800;border-radius:30px;padding:10px 20px;margin:6px}
.credit{text-align:center;color:var(--mute);font-size:13px;margin:22px 0 8px}
.credit a{color:#25a35a;font-weight:800;text-decoration:none}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:30px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.fade{animation:fd .35s ease}

<script>
/* ===== Helpers ===== */
const CORL={'1':'COR 1 · قوية','2a':'COR 2a · متوسطة','2b':'COR 2b · ضعيفة','3NB':'COR 3 · لا فائدة','3H':'COR 3 · ضرر'};
function R(cor,loe,en,ar){return `<div class="rec c${cor}"><div class="rec-h"><span class="cor">${CORL[cor]}</span><span class="loe">LOE ${loe}</span></div><div class="rec-en" dir="ltr">${en}</div>${ar?`<div class="rec-ar">💡 ${ar}</div>`:''}</div>`}
function BOX(type,title,html){const ic={key:'🔑',tip:'💡',warn:'⚠️',exam:'🎯',mem:'🧠',story:'📖',sum:'📌'}[type]||'•';return `<div class="box ${type}"><div class="box-h">${ic} ${title}</div><div>${html}</div></div>`}
function T(head,rows,cls){return `<div class="tbl-wrap"><table class="${cls||''}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

const CHAPTERS=[];

/* ============ CHAPTER 1 ============ */
CHAPTERS.push({id:1,icon:'📘',title:'المصطلحات والتعريفات والوبائيات',en:'Terminology, Epidemiology & Clinical Phenotypes',mins:15,
body:`
<div class="author">عزيزي الطالب، قبل أن ندخل في الأدوية والتوصيات، يجب أن نتفق على <b>لغة واحدة</b>. نصف أخطاء الطلاب في هذه المحاضرة سببها خلط المصطلحات: <e>IHD</e> و<e>CAD</e> و<e>CCD</e> و<e>ACS</e>… في هذا الفصل سنفكّ هذا التشابك مرة واحدة وإلى الأبد.</div>

<h3>1) ما هو مرض القلب الإقفاري؟</h3>
<p>تخيّل أن القلب <b>محرّك</b> يعمل بلا توقف، ووقوده هو <b>الأكسجين</b> الذي يصله عبر أنابيب صغيرة هي <b>الشرايين التاجية</b> <e>(coronary arteries)</e>. إذا ضاقت هذه الأنابيب أو انسدّت، فلن يصل الوقود الكافي إلى عضلة القلب، خاصة عندما يزيد طلبها عليه (مثل صعود الدرج). هذا النقص في الأكسجين اسمه <b>الإقفار</b> <e>(Ischemia)</e>.</p>
${BOX('key','التعريف كما في المرجع',`<div dir="ltr" class="ltr">Ischemic heart disease (IHD), also known as coronary artery disease (CAD), is defined as: a lack of oxygen <b>“ischemia”</b> and decreased or no blood flow to the myocardium resulting from coronary artery narrowing or obstruction.</div><p>بالعربي: نقص الأكسجين ونقص (أو انعدام) تدفق الدم إلى عضلة القلب، بسبب <b>تضيّق أو انسداد</b> الشرايين التاجية.</p>`)}

<h3>2) كيف يظهر المرض؟ (الأنماط السريرية)</h3>
<p>مرض القلب الإقفاري ليس شكلاً واحداً، بل طيف من الحالات:</p>
<div class="spectrum">
 <div class="sp s1"><b>Silent Ischemia</b><small>إقفار بلا أعراض</small></div>
 <div class="sp s2"><b>Chronic Stable Angina</b><small>ذبحة مستقرة مع الجهد</small></div>
 <div class="sp s3"><b>ACS</b><small>متلازمة شريانية حادة:<br>UA · NSTEMI · STEMI</small></div>
</div>
<ul class="nice">
<li><b>إقفار بدون أعراض سريرية</b> <e>(Myocardial ischemia without clinical symptoms)</e>.</li>
<li><b>الذبحة الصدرية المستقرة المزمنة الجهدية</b> <e>(Chronic stable exertional angina – SA)</e>.</li>
<li><b>المتلازمة الشريانية الحادة</b> <e>(ACS)</e> وتشمل:
 <ul><li><e>Unstable angina (UA)</e> الذبحة غير المستقرة</li><li><e>NSTEMI</e> احتشاء بدون ارتفاع مقطع ST</li><li><e>STEMI</e> احتشاء مع ارتفاع مقطع ST</li></ul></li>
<li><b>التشنّج الوعائي التاجي</b> <e>(Variant / Prinzmetal angina)</e>: أعراضه مشابهة، <u>لكن سببه ليس تصلب الشرايين</u> بل تشنّج مؤقت في الشريان.</li>
</ul>
${BOX('exam','نقطة امتحانية',`سؤال متكرر: «أيّ مما يلي <b>ليس</b> سببه <e>atherosclerosis</e>؟» ← الجواب: <b>Prinzmetal (vasospastic) angina</b>.`)}

<h3>3) قاموس المصطلحات — فكّ التشابك</h3>
${T(['المصطلح','المعنى','ملاحظة للطالب'],[
['<e>IHD</e>','Ischemic Heart Disease','المظلّة الكبرى للمرض'],
['<e>CAD</e>','Coronary Artery Disease','مرادف لـ IHD في المرجع'],
['<e>CHD</e>','Coronary Heart Disease','المظهر التاجي لـ IHD (يُستخدم في الإحصاءات الأمريكية)'],
['<e>CCD</e>','Chronic Coronary Disease','مصطلح دليل <b>AHA/ACC 2023</b> للمرض المزمن المستقر'],
['<e>CCS</e> (ESC)','Chronic Coronary Syndromes','مصطلح دليل <b>ESC 2024</b> الأوروبي'],
['<e>SIHD</e>','Stable Ischemic Heart Disease','العنوان القديم للمحاضرة = CCD'],
['<e>CSA / SA</e>','Chronic Stable Angina','الذبحة المستقرة: نمط متكرر متوقع'],
['<e>ACS</e>','Acute Coronary Syndrome','حالة <b>طارئة</b>: UA, NSTEMI, STEMI'],
['<e>ANOCA</e>','Angina with No Obstructive Coronary Arteries','ذبحة مع شرايين غير مسدودة في القسطرة'],
['<e>INOCA</e>','Ischemia with No Obstructive Coronary Arteries','إقفار مثبت مع شرايين غير مسدودة'],
['<e>MACE</e>','Major Adverse Cardiovascular Events','الوفاة القلبية، الاحتشاء، الجلطة الدماغية…'],
['<e>GDMT</e>','Guideline-Directed Medical Therapy','العلاج الدوائي الموصى به في الدلائل']
])}
${BOX('warn','فخ شائع: CCS لها معنيان!',`<b>CCS</b> قد تعني <e>Chronic Coronary Syndromes</e> (التسمية الأوروبية للمرض) وقد تعني <e>Canadian Cardiovascular Society</e> (تصنيف شدة الذبحة I–IV). اقرأ سياق السؤال جيداً.`)}

<h3>4) الوبائيات — حجم المشكلة</h3>
<div class="stats">
<div class="stat"><b>239 مليون</b><span>شخص يعيشون مع IHD عالمياً (GBD 2023)</span></div>
<div class="stat"><b>8.91 مليون</b><span>وفاة سنوياً بسبب IHD عالمياً (2023)</span></div>
<div class="stat"><b>193 مليون</b><span>سنة حياة مُعدّلة بالإعاقة (DALYs) بسبب IHD في 2023</span></div>
<div class="stat"><b>&gt;20.5 مليون</b><span>بالغ أمريكي مصاب بـ CHD (JACC Stats 2026)</span></div>
<div class="stat"><b>349,470</b><span>وفاة بـ CHD في أمريكا 2023 (AHA 2026)</span></div>
</div>
<h4>🇯🇴 في الأردن</h4>
<p>مرض القلب الإقفاري هو <b>السبب الفردي الأول للوفاة في الأردن</b> (WHO 2023)، بمعدل <b>36.3 وفاة لكل 100,000</b> نسمة.</p>
${BOX('warn','لا تخلط بين IHD وكل أمراض القلب والأوعية (CVD)',`رقم <b>15,889</b> (World Heart Federation 2024) هو وفيات <b>كل</b> أمراض القلب والأوعية في الأردن، ويشمل الجلطة الدماغية وفشل القلب وغيرها — وليس IHD وحده.`)}
<p><b>الأهمية السريرية:</b> الوقاية تستهدف عوامل الخطر القابلة للتعديل: ارتفاع الضغط، ارتفاع <e>LDL-C</e>، السكري، التدخين.</p>

<h3>5) كيف تقرأ توصيات الدليل؟ (COR & LOE)</h3>
<p>كل توصية في هذه المحاضرة لها رقمان: <b>قوة التوصية</b> <e>(Class of Recommendation)</e> و<b>مستوى الدليل</b> <e>(Level of Evidence)</e>. فهمهما يجعل حفظ التوصيات أسهل بكثير لأن <b>الصياغة اللغوية تكشف الدرجة</b>:</p>
${T(['COR','المعنى','الكلمات الدالة في النص'],[
['<span class="pill c1">1</span>','قوية: الفائدة ≫ الخطر','<e>is recommended / is indicated / should be</e>'],
['<span class="pill c2a">2a</span>','متوسطة: الفائدة &gt; الخطر','<e>is reasonable / can be useful / can be beneficial</e>'],
['<span class="pill c2b">2b</span>','ضعيفة: الفائدة ≥ الخطر','<e>may be reasonable / may be considered</e>'],
['<span class="pill c3NB">3: No Benefit</span>','لا فائدة','<e>is not recommended / not useful / not beneficial</e>'],
['<span class="pill c3H">3: Harm</span>','ضرر: الخطر &gt; الفائدة','<e>potentially harmful / should not be used / avoid</e>']
])}
${T(['LOE','مصدر الدليل'],[
['<b>A</b>','دليل عالي الجودة: أكثر من تجربة عشوائية RCT، أو تحليلات تجميعية'],
['<b>B-R</b>','دليل متوسط من تجارب عشوائية (Randomized)'],
['<b>B-NR</b>','دليل متوسط من دراسات غير عشوائية / رصدية'],
['<b>C-LD</b>','بيانات محدودة (Limited Data)'],
['<b>C-EO</b>','رأي خبراء (Expert Opinion)']
])}
${BOX('tip','نصيحة المؤلف',`في هذا التطبيق كل توصية ملوّنة بلون درجتها: <span class="pill c1">أخضر = 1</span> <span class="pill c2a">أصفر = 2a</span> <span class="pill c2b">برتقالي = 2b</span> <span class="pill c3H">أحمر = 3 ضرر</span> — نفس ألوان الدليل الأمريكي، فيسهل التذكّر البصري.`)}

<h3>المراجع المعتمدة في المحاضرة</h3>
<ol class="refs" dir="ltr"><li>Pharmacotherapy Principles &amp; Practice, 12th ed. — Chapter 33 (Stable Ischemic Heart Disease)</li><li>2023 AHA/ACC Guideline for the Management of Patients with Chronic Coronary Disease (Circulation)</li><li>2024 ESC Guidelines for the management of chronic coronary syndromes</li><li>2026 ACC/AHA Guideline on the Management of Dyslipidemia (Blumenthal, Morris et al.)</li></ol>
${BOX('sum','خلاصة الفصل',`<ul><li>IHD = CAD = نقص أكسجين لعضلة القلب بسبب تضيّق/انسداد الشرايين التاجية.</li><li>الطيف: إقفار صامت ← ذبحة مستقرة ← ACS (UA, NSTEMI, STEMI).</li><li>Prinzmetal = تشنّج، وليس تصلّب شرايين.</li><li>IHD السبب الأول للوفاة في الأردن (36.3/100,000).</li><li>COR: 1 قوية، 2a معقولة، 2b قد تُعتبر، 3 لا فائدة/ضرر.</li></ul>`)}
`});

/* ============ CHAPTER 2 ============ */
CHAPTERS.push({id:2,icon:'🫀',title:'الفيزيولوجيا المرضية: العرض والطلب والتصلّب',en:'Pathophysiology: O₂ Supply/Demand, Atherosclerosis & Ischemia',mins:18,
body:`
<div class="author">هذا الفصل هو <b>مفتاح فهم الأدوية</b>. كل دواء ستدرسه لاحقاً إمّا يزيد عرض الأكسجين أو يقلل الطلب عليه. إذا فهمت الميزان الذي سأرسمه لك الآن، ستستنتج آلية عمل أي دواء بنفسك.</div>

<h3>1) الميزان: عرض الأكسجين مقابل الطلب</h3>
<div class="balance">
 <div class="pan sup"><h5>Oxygen Supply ⬆️<br>عرض الأكسجين</h5><ul><li>Coronary Blood Flow<br><small>تدفق الدم التاجي</small></li><li>Oxygen Extraction<br><small>استخلاص الأكسجين</small></li><li>Oxygen Availability<br><small>توفّر الأكسجين (التشبّع، الهيموغلوبين)</small></li></ul></div>
 <div class="fulcrum">⚖️</div>
 <div class="pan dem"><h5>Oxygen Demand (MVO₂) ⬆️<br>الطلب على الأكسجين</h5><ul><li>Heart Rate<br><small>معدل ضربات القلب</small></li><li>Contractility<br><small>قوة الانقباض</small></li><li>Intramyocardial Wall Tension<br><small>شدّ جدار العضلة (يتأثر بالـ preload والـ afterload)</small></li></ul></div>
</div>
<p>في معظم الحالات المستقرة يكون <b>العرض ثابتاً</b> (لأن الشريان مُضيّق بلويحة ثابتة)، والذي يحدث هو أن <b>الطلب يزداد</b> مع الجهد فيختل الميزان ← ألم. لذلك فإن التحكم في <e>MVO₂</e> هو أساس العلاج.</p>
${BOX('mem','احفظها هكذا: الطلب = 3 أشياء',`<b>H-C-W</b>: <b>H</b>eart rate – <b>C</b>ontractility – <b>W</b>all tension.<br>Beta-blocker يخفّض H وC ⟵ يخفض الطلب. Nitrates تخفض preload ⟵ تخفض W. وهكذا.`)}

<h3>2) ما الذي يقلل العرض؟</h3>
<ul class="nice">
<li><b>نقص تدفق الدم التاجي:</b> بسبب لويحة تصلّب <e>(atherosclerotic plaque)</e>، أو تشنّج <e>(vasospasm)</e>، أو جلطة <e>(thrombus)</e>.</li>
<li><b>نقص محتوى الأكسجين الشرياني:</b> بسبب نقص الأكسجة <e>(hypoxia)</e>.</li>
<li><b>تسرّع القلب (Tachycardia):</b> الشرايين التاجية تمتلئ أثناء <b>الانبساط</b> <e>(diastole)</e>. عندما يتسارع القلب يقصر زمن الانبساط فيقلّ الإرواء التاجي. <span class="hl">لهذا تسرّع القلب سيئ مرتين: يزيد الطلب ويقلل العرض!</span></li>
<li><b>نقص قدرة الدم على حمل الأكسجين:</b> فقر الدم <e>(Anemia)</e>، التسمم بأول أكسيد الكربون <e>(CO poisoning)</e>، أمراض القلب الخلقية المزرقّة <e>(Cyanotic congenital heart disease)</e> — قد تسبب إقفاراً <b>حتى مع إرواء تاجي جيد</b>.</li>
</ul>
${BOX('key','الفرق الجوهري بين الذبحة المستقرة و ACS',`<b>Stable angina:</b> لويحة تصلّب ثابتة تضيّق الشريان ← المشكلة في <b>زيادة الطلب</b>.<br><b>ACS:</b> <b>تمزّق اللويحة</b> <e>(plaque disruption)</e> ثم تكوّن <b>جلطة</b> ← نقص <b>مفاجئ</b> في العرض.`)}

<h3>3) قصة تصلّب الشرايين (Atherosclerosis)</h3>
<p>التصلّب عملية <b>معقدة وتمتد طوال الحياة</b>، و<b>الالتهاب</b> <e>(inflammation)</e> يلعب دوراً أساسياً في <b>كل مراحلها</b> (وهذا يفسّر لاحقاً دور <e>colchicine</e> والستاتينات).</p>
<div class="steps">
<div class="st"><b>1</b><span>شريان طبيعي <small>(Panel A)</small></span></div>
<div class="st"><b>2</b><span>لويحة <b>مستقرة</b>: لبّ دهني <b>صغير</b> وغطاء ليفي <b>سميك</b> من عدة طبقات خلايا عضلية ملساء <small>(Panel B)</small></span></div>
<div class="st"><b>3</b><span>لويحة <b>غير مستقرة</b>: لبّ دهني كبير وغطاء رقيق ← تتشقق <e>(fissure)</e></span></div>
<div class="st"><b>4</b><span>التصاق الصفائح على الشق <e>(platelet adhesion)</e> ← شبكة تسدّ جزئياً</span></div>
<div class="st"><b>5</b><span>جلطة سادّة <e>(occlusive thrombus)</e> ← احتشاء</span></div>
</div>
${BOX('tip','الربط بالعلاج',`بما أن الجلطة تبدأ بالصفائح ← نستخدم <b>مضادات الصفائح</b> (Aspirin) للوقاية. وبما أن اللويحة دهنية ← <b>الستاتين</b> يثبّتها ويخفض LDL. وطرق الـ PCI/CABG إمّا <b>تضغط</b> اللويحة أو <b>تقطعها</b> أو <b>تتجاوزها</b> لتحسين العرض.`)}

<h3>4) الأنواع الأربعة للذبحة — مقارنة شاملة</h3>
${T(['النوع','الآلية','الخصائص'],[
['<b>1. Stable Angina</b><br>المستقرة','تصلّب شرايين ثابت','نوبات متوقعة مرتبطة بعمل القلب (MVO₂)، تثيرها: الجهد، البرد، التوتر، العاطفة، الأكل. مزمنة وتحتاج أدوية وقائية'],
['<b>2. Unstable Angina</b><br>غير المستقرة','جلطات صفائحية صغيرة متكررة على لويحة ممزقة + تشنّج موضعي','تغيّر في طبيعة/تكرار/مدة الألم أو ألم مطوّل أثناء الراحة. <b>حالة طارئة</b> وجزء من ACS'],
['<b>3. Prinzmetal</b><br>التشنّجية','تشنّج عابر للشريان (قد يرافقه تصلّب)','مرضى أصغر سناً وعوامل خطر قليلة، الألم غير متوقع ودوري، <b>أثناء الراحة وفي الصباح الباكر</b>، لا يثيره الجهد ولا يزول بالراحة، و<b>ST elevation</b> بدل الانخفاض'],
['<b>4. Silent Ischemia</b><br>الصامتة','إقفار عابر بلا أعراض','تغيّرات ECG دون ألم؛ شائع جداً ويُكتشف بتسجيل <e>Holter</e> المستمر']
])}
<h3>5) الآليات الثلاث للإقفار</h3>
<div class="cards3">
<div class="mini"><b>Obstructive</b><span>انسدادي: لويحة تضيّق الشريان الكبير (الأشيع).</span></div>
<div class="mini"><b>Vasospastic</b><span>تشنّجي: انقباض مؤقت في الشريان التاجي.</span></div>
<div class="mini"><b>Microvascular</b><span>خلل في الأوعية الدقيقة: القسطرة تبدو طبيعية لكن يوجد إقفار (ANOCA/INOCA).</span></div>
</div>

<h3>6) حالات تثير الإقفار أو تزيده سوءاً</h3>
${T(['زيادة الطلب ⬆️','نقص العرض ⬇️'],[
['<b>غير قلبية:</b> ارتفاع الحرارة، فرط الدرقية، التسمم بالمحاكيات الودية (الكوكايين)، ارتفاع الضغط، القلق، الناسور الشرياني الوريدي','<b>غير قلبية:</b> فقر الدم، نقص الأكسجة (التهاب رئوي، ربو، COPD، ارتفاع ضغط رئوي، تليف رئوي، انقطاع النفس الانسدادي النومي)، فقر الدم المنجلي، الكوكايين، فرط اللزوجة (polycythemia، اللوكيميا، كثرة الصفائح، hypergammaglobulinemia)'],
['<b>قلبية:</b> اعتلال العضلة الضخامي، تضيّق الأبهر، اعتلال العضلة التوسعي، تسرّع القلب (بطيني أو فوق بطيني)','<b>قلبية:</b> تضيّق الأبهر، اعتلال العضلة الضخامي']
])}
${BOX('exam','انتبه',`<b>الكوكايين</b> و<b>تضيّق الأبهر</b> و<b>اعتلال العضلة الضخامي</b> موجودة في العمودين معاً (تزيد الطلب وتقلل العرض) — سؤال مفضّل!`)}
${BOX('sum','خلاصة الفصل',`<ul><li>العرض: تدفق تاجي + استخلاص + توفّر O₂. الطلب: HR + Contractility + Wall tension.</li><li>الشرايين التاجية تمتلئ في الانبساط ← tachycardia تقلل العرض.</li><li>المستقرة = زيادة طلب على لويحة ثابتة؛ ACS = تمزق لويحة + جلطة.</li><li>الالتهاب حاضر في كل مراحل التصلّب.</li></ul>`)}
`});

/* ============ CHAPTER 3 ============ */
CHAPTERS.push({id:3,icon:'🩺',title:'الصورة السريرية وتصنيف CCS والعلامات الحمراء',en:'Clinical Presentation, CCS Grading & Red Flags for ACS',mins:15,
body:`
<div class="author">في الصيدلية أو العيادة، أول سؤال تطرحه على نفسك: <b>هل هذا ألم ذبحة مستقرة أستطيع التعامل معه؟ أم ACS يجب تحويله فوراً للطوارئ؟</b> هذا الفصل يعلّمك التمييز.</div>

<h3>1) لماذا نفرّق بين CSA و UA؟</h3>
<p>لأن <b>UA</b> مرتبطة بخطر أكبر للاحتشاء والوفاة وتحتاج علاجاً <b>أكثر شراسة</b>. أما <b>CSA</b> فأعراضها <b>قابلة للتكرار والتوقّع</b> <e>(reproducible)</e> لأن سببها زيادة الطلب: نفس النوعية، نفس المكان، نفس الأعراض المرافقة، عند نفس مستوى الجهد في كل نوبة. <b>الاستثناء</b>: مريض التشنّج الوعائي، أعراضه متغيرة وغير متوقعة.</p>
<p>مريض CSA عادة يأتي <b>دون ضيق حاد</b>. إذا جاءك المريض في <b>ضيق حاد</b> ← اشتبه بـ <b>ACS</b>.</p>

<h3>2) المكوّنات الخمسة لوصف ألم الصدر</h3>
<div class="five">
<div><b>1</b>Quality<small>النوعية</small></div><div><b>2</b>Location<small>المكان</small></div><div><b>3</b>Duration<small>المدة</small></div><div><b>4</b>Provoking<small>ما يثيره</small></div><div><b>5</b>Relieving<small>ما يخففه</small></div>
</div>
<ul class="nice">
<li><b>الألم النموذجي:</b> إحساس <b>ضغط، ثقل، أو عصر</b> في مقدمة الصدر. <span class="hl">الألم الحاد الواخز <e>(sharp)</e> ليس عرضاً نموذجياً لـ IHD.</span></li>
<li><b>الانتشار:</b> إلى الرقبة، الفك، الكتف، الظهر، أو الذراع.</li>
<li><b>الأعراض المرافقة:</b> ضيق نفس <e>(dyspnea)</e>، غثيان، إقياء، تعرّق <e>(diaphoresis)</e>.</li>
<li><b>المثيرات:</b> الجهد (المشي، صعود الدرج، أعمال المنزل والحديقة)، التوتر العاطفي، <b>البرد</b>، <b>الوجبات الثقيلة</b>.</li>
<li><b>المخففات:</b> الراحة أو <e>sublingual nitroglycerin</e> خلال دقائق.</li>
</ul>

<h3>3) جدول التصنيف السريري لألم الصدر</h3>
${T(['البند','التفاصيل'],[
['<b>الأعراض</b>','ضغط أو ثقل على الصدر، أو ألم يوصف بالضيق/الحرقة/السحق/العصر/كالملزمة <e>(vicelike)</e>/عميق؛ يزداد تدريجياً ثم يخفت تدريجياً (يميّزه عن تشنّج المريء)؛ ضيق نفس مع إحساس انقباض حول الحنجرة'],
['<b>المدة</b>','<b>0.5 – 30 دقيقة</b>'],
['<b>المكان</b>','فوق القص أو قربه؛ أي مكان بين الشرسوف والبلعوم؛ أحياناً الكتف والذراع الأيسر فقط؛ نادراً الذراع الأيمن فقط؛ أسفل الرقبة/أعلى الظهر؛ بين لوحي الكتف الأيسر'],
['<b>الانتشار</b>','الجهة الداخلية للذراع الأيسر، الكتف الأيسر، الفك، أحياناً الذراع الأيمن'],
['<b>ECG</b>','<b>ST-segment depression</b> و/أو <b>T-wave inversion</b>'],
['<b>المثيرات</b>','جهد خفيف/متوسط/شديد حسب المريض، جهد برفع الذراعين فوق الرأس، البرد، المشي عكس الريح، المشي بعد وجبة كبيرة، العواطف (خوف، غضب، قلق)، الجماع'],
['<b>استجابة النيتروجلسرين</b>','زوال الألم خلال <b>45 ثانية – 5 دقائق</b>']
])}

<h3>4) نموذجي أم غير نموذجي؟</h3>
${T(['التصنيف','الشروط'],[
['<b>Typical (definite) angina</b>','تحقق الثلاثة: ① انزعاج خلف القص بنوعية ومدة مميزة ② يُثار بالجهد أو التوتر العاطفي ③ يزول بالراحة أو النيتروجلسرين'],
['<b>Atypical (probable) angina</b>','يحقق <b>2</b> من الثلاثة'],
['<b>Noncardiac chest pain</b>','يحقق <b>1</b> أو لا شيء']
])}
${BOX('warn','الفئات الخاصة',`<b>النساء ومرضى السكري</b> قد يأتون بأعراض غير نموذجية: عسر هضم، امتلاء معدي، ضيق نفس. ومريض <b>السكري</b> قد يشعر بضيق نفس وتعرّق <b>دون أي ألم صدري كلاسيكي!</b> وأحياناً لا يسبب الإقفار أي أعراض ← <b>Silent ischemia</b>.`)}

<h3>5) تصنيف الجمعية الكندية CCS لشدة الذبحة</h3>
<p>شدة الأعراض <b>لا ترتبط</b> بشدة تضيّق الشرايين، لكن يجب تقييمها لأنها توجّه التشخيص والعلاج. تصنيف <b>Canadian Cardiovascular Society</b> يقيس <b>الإعاقة الناتجة عن الذبحة</b>، ووُجد ارتباط ذو دلالة إحصائية بين درجة CCS وشدة المرض في القسطرة.</p>
<div class="ccs">
<div class="cc c1"><b>Class I</b><span>النشاط العادي (المشي، صعود الدرج) <b>لا</b> يسبب ذبحة؛ تحدث فقط مع جهد <b>شديد أو سريع أو مطوّل</b>.</span></div>
<div class="cc c2"><b>Class II</b><span><b>تحديد طفيف</b> للنشاط العادي: المشي السريع أو صعود الدرج بسرعة، صعود مرتفع، بعد الأكل، في البرد/الريح، التوتر، أول ساعات بعد الاستيقاظ، المشي أكثر من <b>بلوكين</b> أو صعود أكثر من <b>طابق</b> بسرعة عادية.</span></div>
<div class="cc c3"><b>Class III</b><span><b>تحديد واضح</b>: الذبحة تحدث عند مشي <b>بلوك إلى بلوكين</b> أو صعود <b>طابق واحد</b> بسرعة عادية.</span></div>
<div class="cc c4"><b>Class IV</b><span>قد توجد الأعراض <b>أثناء الراحة</b>؛ لا يستطيع أي نشاط بدون انزعاج.</span></div>
</div>
${BOX('mem','حيلة الحفظ',`<b>I</b> = جهد شديد فقط · <b>II</b> = أكثر من طابق/بلوكين · <b>III</b> = طابق واحد/بلوك-بلوكين · <b>IV</b> = راحة.`)}

<h3>6) 🚨 العلامات الحمراء: متى تحوّل المريض للطوارئ؟</h3>
${BOX('warn','اشتبه بـ ACS عند وجود أي مما يلي',`<ul><li>ألم يحدث <b>أثناء الراحة</b> دون مثير.</li><li>ألم <b>مطوّل</b> لا يزول بالنيتروجلسرين تحت اللسان.</li><li>تغيّر في <b>طبيعة أو تكرار أو مدة</b> الذبحة عند مريض مستقر سابقاً.</li><li>مريض في <b>ضيق حاد</b>.</li><li>إذا لم تُزِل <b>الجرعة الأولى</b> من SL NTG الألم ← اتصل بالإسعاف (حسب جدول تثقيف المرضى في المرجع)؛ ولا تتجاوز 2–3 أقراص خلال 15 دقيقة.</li></ul>`)}
${BOX('sum','خلاصة الفصل',`<ul><li>الذبحة المستقرة: متوقعة، مع الجهد، 0.5–30 دقيقة، تزول بالراحة/NTG خلال 45 ث – 5 د.</li><li>Typical = 3 صفات، Atypical = 2، Noncardiac = 1 أو 0.</li><li>CCS I–IV: من الجهد الشديد إلى الراحة.</li><li>ألم الراحة/المطوّل/غير المستجيب للنيترات = ACS حتى يثبت العكس.</li></ul>`)}
`});

CHAPTERS.push({id:4,icon:'🔬',title:'التقييم التشخيصي وتصنيف الخطورة',en:'Diagnostic Evaluation & Risk Stratification (incl. ANOCA/INOCA)',mins:12,
body:`
<div class="author">لن يُطلب منك كصيدلاني أن تقرأ صورة MPI، لكن يُطلب منك أن تعرف <b>متى</b> يُطلب الفحص، وكيف <b>يُصنَّف</b> المريض حسب خطره، لأن هذا التصنيف يحدد شدة العلاج.</div>

<h3>1) متى نعيد الفحص التشخيصي؟</h3>
${R('1','B-NR','In patients with CCD and a <b>change in symptoms or functional capacity that persists despite GDMT</b>, stress PET/SPECT MPI, CMR imaging, or stress echocardiography is recommended to detect the presence and extent of myocardial ischemia, estimate risk of MACE, and guide therapeutic decision-making.','إذا تغيّرت أعراض المريض أو قدرته الوظيفية رغم العلاج الأمثل ← نطلب فحص إجهاد تصويري.')}
${T(['الاختصار','الفحص'],[
['<e>PET/SPECT MPI</e>','تصوير إرواء عضلة القلب بالنظائر المشعة تحت الإجهاد'],
['<e>CMR</e>','الرنين المغناطيسي القلبي'],
['<e>Stress Echo</e>','تخطيط صدى القلب تحت الإجهاد'],
['<e>ICA</e>','القسطرة التاجية الغازية (Invasive Coronary Angiography)'],
['<e>EST</e>','اختبار الجهد بالتمرين (Exercise Stress Test)']
])}

<h3>2) تصنيف الخطورة السنوية</h3>
${R('1','B-NR','In patients with CCD, it is recommended that risk stratification incorporate all available information (noninvasive, invasive, or both testing results) or use validated risk scores to classify patients as <b>low (&lt;1%), intermediate (1%–3%), or high (&gt;3%) yearly risk</b> for cardiovascular death or nonfatal MI.')}
<div class="risk">
<div class="rk lo"><b>&lt; 1%</b><span>منخفض</span></div>
<div class="rk mid"><b>1 – 3%</b><span>متوسط</span></div>
<div class="rk hi"><b>&gt; 3%</b><span>مرتفع</span></div>
</div>
<p class="center small">نسبة الخطر <b>السنوية</b> للوفاة القلبية أو الاحتشاء غير المميت</p>

${R('1','A','In patients with CCD, <b>optimization of GDMT</b> is recommended to reduce MACE.')}
${R('1','A','In patients with CCD with <b>newly reduced LV systolic function, clinical heart failure, or both</b>, ICA is recommended to assess coronary anatomy and guide potential revascularization.','انخفاض جديد في وظيفة البطين أو فشل قلب ← قسطرة.')}
${R('3NB','A','ICA for risk stratification is <b>not routinely recommended</b> in patients <u>without</u> LV systolic dysfunction, heart failure, stable chest pain refractory to GDMT, and/or noninvasive testing suggestive of significant (&gt;50%) left main disease.','لا نعمل قسطرة روتينية لمجرد تصنيف الخطورة.')}

<h3>3) عوامل تزيد خطر MACE (Table 5)</h3>
<div class="chips">
<span>العمر</span><span>الذكور</span><span>ضعف الدعم الاجتماعي</span><span>الفقر/صعوبة الوصول للرعاية</span><span>ارتفاع BMI</span><span>MI أو PCI أو CABG سابق</span><span>فشل القلب HF</span><span>الرجفان/الرفرفة الأذينية</span><span>السكري</span><span>اضطراب الدهون</span><span>مرض الكلى المزمن CKD</span><span>مدخّن حالي أو سابق</span><span>مرض الشرايين الطرفية PAD</span><span>الاكتئاب</span><span>ضعف الالتزام بالأدوية</span>
</div>
<h4>من الفحوصات المساعدة:</h4>
<ul class="nice">
<li>عدم القدرة على التمرين؛ ذبحة مع الإجهاد.</li>
<li><b>ECG:</b> حصار الحزمة اليسرى (LBBB)، تضخم البطين الأيسر (LVH)، ارتفاع نبض الراحة.</li>
<li><b>Echo:</b> انخفاض الكسر القذفي (LVEF)، LVH.</li>
<li><b>EST:</b> DTS أعلى (Duke Treadmill Score)، نبض راحة أعلى، الوصول لنبض &lt;85% من المتوقع.</li>
</ul>
${BOX('exam','لاحظ',`<b>ضعف الالتزام بالأدوية</b> و<b>الاكتئاب</b> و<b>الفقر</b> عوامل خطر رسمية في الدليل — وهذا يبرر دور الصيدلاني في التثقيف والمتابعة.`)}

<h3>4) ANOCA / INOCA — عندما تكون القسطرة "طبيعية"</h3>
<p>بعض المرضى يعانون ذبحة حقيقية، لكن القسطرة لا تُظهر انسداداً مهماً. هنا نتحدث عن:</p>
<ul class="nice"><li><b>ANOCA</b>: ذبحة دون شرايين مسدودة.</li><li><b>INOCA</b>: إقفار مُثبت دون شرايين مسدودة.</li></ul>
<p>السبب غالباً <b>خلل في الأوعية الدقيقة</b> <e>(coronary microvascular dysfunction)</e> أو <b>تشنّج وعائي</b>. الرسالة المهمة: <u>القسطرة الطبيعية لا تعني أن المريض سليم</u>، ويستحق تقييماً وعلاجاً لعوامل الخطر والأعراض.</p>
${BOX('sum','خلاصة الفصل',`<ul><li>تغيّر الأعراض رغم GDMT ← فحص إجهاد تصويري (1, B-NR).</li><li>الخطر السنوي: &lt;1% منخفض، 1–3% متوسط، &gt;3% مرتفع.</li><li>LV منخفض جديداً أو HF ← ICA (1, A). لا قسطرة روتينية للتصنيف فقط (3: No benefit).</li></ul>`)}
`});

CHAPTERS.push({id:5,icon:'🎯',title:'أهداف العلاج والخطة الفردية',en:'Therapeutic Goals & Individualized Care Planning',mins:14,
body:`
<div class="author">الآن نصل إلى قلب المادة: <b>العلاج</b>. أريدك أن ترى الصورة الكبيرة قبل التفاصيل. علاج مريض IHD المستقر يقف على <b>جناحين</b>: جناح يُطيل العمر، وجناح يُحسّن جودة الحياة.</div>

<h3>1) أهداف العلاج</h3>
<div class="cards2">
<div class="mini g"><b>🛡️ الوقاية من الأحداث (Prognosis)</b><span>تقليل MACE: الوفاة، الاحتشاء، الجلطة الدماغية، وإبطاء تقدّم المرض.<br><small>الأدوات: Aspirin، Statin، ACEi/ARB، Beta-blocker (في حالات محددة)، SGLT2i/GLP-1 RA، نمط الحياة.</small></span></div>
<div class="mini b"><b>😌 تخفيف الأعراض (Symptoms)</b><span>تقليل نوبات الذبحة، تحسين القدرة على الجهد وجودة الحياة.<br><small>الأدوات: SL NTG، Beta-blocker، CCB، Nitrates طويلة المفعول، Ranolazine، وأحياناً Revascularization.</small></span></div>
</div>
${BOX('exam','سؤال مهم',`<b>أيّ الأدوية يحسّن البقاء (survival)؟</b> مضادات الصفائح، الستاتينات، ACEi/ARB (في المؤشرات)، Beta-blockers (مع LVEF ≤40%). أما <b>النترات و Ranolazine</b> فتخفف الأعراض فقط ولا تُطيل العمر.`)}

<h3>2) خوارزمية العلاج الشاملة (من Pharmacotherapy)</h3>
<div class="algo">
<div class="col">
 <div class="ah">🛡️ تعديل عوامل الخطر</div>
 <div class="an">نمط الحياة: الغذاء، الرياضة، إنقاص الوزن، الإقلاع عن التدخين</div>
 <div class="an">لقاح الإنفلونزا السنوي</div>
 <div class="an">علاج الأمراض المرافقة:<br>HTN: BP &lt;130/80 · DM: HbA1c ≤7% · Statin متوسطة–عالية الشدة</div>
 <div class="an">مضاد صفائح: Aspirin 81 mg يومياً<br>أو Clopidogrel 75 mg عند حساسية الأسبرين<br><small>DAPT قد يكون معقولاً لبعض مرضى الخطر العالي</small></div>
 <div class="an">ACE inhibitor إذا HTN أو DM أو LVEF ≤40% أو CKD<br>أو ARB عند عدم التحمّل</div>
</div>
<div class="col">
 <div class="ah">😌 علاج الذبحة</div>
 <div class="an">SL Nitroglycerin للنوبات الحادة (للجميع)</div>
 <div class="ad">ذبحة تشنّجية؟</div>
 <div class="an split"><span><b>نعم:</b> BP &lt;130/80 ← أضف Nitrate طويل المفعول؛ BP ≥130/80 ← أضف CCB</span></div>
 <div class="an"><b>لا:</b> إذا النبض &gt;60 ← ① Beta-blocker ② Non-DHP CCB</div>
 <div class="ad">هل تمت السيطرة على الأعراض؟</div>
 <div class="an"><b>نعم:</b> استمر وراقب</div>
 <div class="an"><b>لا:</b> BP &lt;130/80 ← أضف Ranolazine أو LA nitrate<br>BP ≥130/80 ← أضف DHP CCB</div>
 <div class="an red">استمرار الذبحة ← فكّر في PCI أو CABG</div>
</div>
</div>
${BOX('tip','منطق الخوارزمية (افهمه ولا تحفظه)',`لماذا نضيف <b>DHP CCB</b> إذا كان الضغط مرتفعاً؟ لأنه يخفض الضغط أيضاً فنستفيد مرتين. ولماذا نضيف <b>Ranolazine</b> أو <b>nitrate</b> إذا كان الضغط منخفضاً؟ لأن Ranolazine <b>لا يؤثر تقريباً على الضغط والنبض</b>. ولماذا لا نبدأ BB إذا النبض &lt;60؟ لأنه سيزيد بطء القلب.`)}

<h3>3) حيلة ABCDE لتذكّر الخطة الكاملة</h3>
${T(['الحرف','المعنى'],[
['<b>A</b>','<b>A</b>ntiplatelet (Aspirin) + <b>A</b>ntianginal + <b>A</b>CEi/ARB'],
['<b>B</b>','<b>B</b>eta-blocker + <b>B</b>lood pressure control'],
['<b>C</b>','<b>C</b>holesterol (Statin) + <b>C</b>igarette cessation'],
['<b>D</b>','<b>D</b>iet + <b>D</b>iabetes control'],
['<b>E</b>','<b>E</b>ducation + <b>E</b>xercise (Cardiac rehab)']
])}

<h3>4) الرعاية الفردية (Individualized care)</h3>
<p>لا يوجد علاج واحد للجميع. اختيار الدواء يعتمد على: <b>معدل النبض HR، الضغط BP، الكسر القذفي LVEF، الأمراض المرافقة، الآثار الجانبية، التداخلات الدوائية</b>، و<b>تفضيلات المريض</b>. وفي اختيار PCI أو CABG نضيف: تشريح الشرايين، شدة الأعراض، الخطر الجراحي، والفائدة المتوقعة.</p>
<h4>خطة التثقيف الفردية للمريض تتضمن:</h4>
<ol class="nice">
<li>أهمية الالتزام بالأدوية للسيطرة على الأعراض وإبطاء المرض.</li>
<li>شرح الأدوية واستراتيجيات تقليل الخطر بما يناسب مستوى فهم المريض وقراءته وثقافته.</li>
<li>مراجعة شاملة لكل الخيارات العلاجية.</li>
<li>وصف مستوى الرياضة المناسب وتشجيع النشاط اليومي.</li>
<li>تعليم مهارات المراقبة الذاتية.</li>
<li>كيف يتعرّف على تدهور الأعراض ويتصرف بشكل صحيح.</li>
</ol>
${BOX('sum','خلاصة الفصل',`<ul><li>جناحان: الوقاية من MACE + تخفيف الأعراض.</li><li>النترات وRanolazine للأعراض فقط.</li><li>BB أولاً إذا HR &gt;60 وغير تشنّجية؛ في التشنّجية CCB/nitrate.</li><li>ABCDE تجمع الخطة كلها.</li></ul>`)}
`});

${R('1','C-LD','Patients should be routinely asked and counseled about substance use.')}
${R('2a','B-NR','In those who consume alcohol, limit intake (<b>≤1 drink/d women, ≤2 drinks/d men</b>).')}
${R('3NB','B-NR','Patients should <b>not be advised to consume alcohol</b> for cardiovascular protection.')}

${R('2a','B-NR','Individualize resumption of sexual activity based on type of activity, exercise capacity, and post-procedural healing.')}

${R('3H','B-NR','<b>PDE5 inhibitors should not be used concomitantly with nitrates</b> because of risk for severe hypotension.','تداخل قاتل! Sildenafil/Vardenafil: فاصل 24 ساعة، Tadalafil: 48 ساعة.')}

${R('1','C-EO','Assessment of <b>BMI ± waist circumference</b> during routine follow-up.')}

${R('3H','B-R','Use of <b>sympathomimetic weight loss drugs</b> is potentially harmful.','تزيد النبض والضغط ← تزيد الطلب على الأكسجين.')}
<p><b>الأهداف للمريض:</b> BMI بين <b>18.5–24.9</b> كغ/م²، ومحيط خصر <b>&lt;102 سم (40 إنش) للرجال</b> و<b>&lt;88 سم (35 إنش) للنساء</b> (أقل لبعض الأعراق).</p>

<h3>7) التأهيل القلبي والنشاط البدني 🏃</h3>
${R('1','A / B-R / C-LD','All patients with CCD and appropriate indications should be referred to a <b>cardiac rehabilitation</b> program: after recent MI, PCI, or CABG (A); with stable angina or after heart transplant (B-R); after spontaneous coronary artery dissection (C-LD).')}

<div class="stats">

<div class="stat"><b>2+</b><span>يوم/أسبوع تمارين مقاومة</span></div>

<h3>8) التعرّضات البيئية</h3>
${R('2a','B-NR','Minimization of exposure to <b>ambient air pollution</b> is reasonable.')}
${R('2b','B-NR','Minimization of climate-related exposures (extreme temperatures, wildfire smoke) may be reasonable.')}

${BOX('exam','قارن الدرجات',`الإنفلونزا <span class="pill c1">1, A</span> — كوفيد <span class="pill c1">1, C-EO</span> — المكورات الرئوية <span class="pill c2a">2a</span>.`)}

CHAPTERS.push({id:7,icon:'💊',title:'الوقاية من الأحداث: الدهون ومضادات التخثر',en:'Event Prevention: Lipid-Lowering & Antithrombotic Therapy (+ BB, RAAS, Colchicine)',mins:30,
body:`
<div class="author">هذا أثقل فصل في المحاضرة وأكثرها أسئلةً، لأنه يحتوي على <b>أهداف LDL الجديدة (2026)</b> و<b>مدد مضادات الصفائح</b>. خذه على جرعات: أولاً الدهون، ثم مضادات التخثر، ثم بقية أدوية الوقاية.</div>

<h2 class="part">الجزء الأول: خفض الدهون</h2>
<h3>1) توصيات دليل CCD 2023</h3>
${R('1','A','<b>High-intensity statin</b> therapy is recommended with the aim of achieving a <b>≥50% reduction in LDL-C</b> to reduce MACE. <i>(ESC 2024: ↓LDL to &lt;55 mg/dL)</i>')}
${R('1','A','If high-intensity statin is contraindicated or not tolerated, <b>moderate-intensity statin</b> is recommended aiming for a <b>30%–49%</b> LDL-C reduction.')}
${R('1','A','Assess adherence and response with <b>fasting lipids 4–12 weeks</b> after statin initiation or dose adjustment, then <b>every 3–12 months</b> as needed.')}

<h3>2) شدة الستاتينات (Table 11) — احفظ هذا الجدول!</h3>
${T(['High Intensity<br>↓LDL ≥50%','Moderate Intensity<br>↓LDL 30–49%','Low Intensity<br>↓LDL &lt;30%'],[
['<b>Atorvastatin 40–80 mg</b>','Atorvastatin 10 (20) mg','Simvastatin 10 mg'],
['<b>Rosuvastatin 20 (40) mg</b>','Rosuvastatin (5) 10 mg','Pravastatin 10–20 mg'],
['—','Simvastatin 20–40 mg','Lovastatin 20 mg'],
['—','Pravastatin 40 (80) mg','Fluvastatin 20–40 mg'],
['—','Lovastatin 40 (80) mg','—'],
['—','Fluvastatin XL 80 mg / Fluvastatin 40 mg BID','—'],
['—','Pitavastatin 1–4 mg','—']
],'small')}
${BOX('mem','حيلة الحفظ',`فقط <b>دواءان</b> يصلان للشدة العالية: <b>A</b>torvastatin 40–80 و <b>R</b>osuvastatin 20–40 ← "<b>AR</b> = عالي". تذكّر: <b>Atorva 40/80 – Rosuva 20/40</b>.`)}

<h3>3) أهداف LDL الجديدة — دليل الدهون ACC/AHA 2026</h3>
<p>القاعدة الجديدة: لم نعد نكتفي بنسبة الخفض، بل هناك <b>أهداف رقمية</b> حسب درجة الخطورة:</p>
<div class="goals">
<div class="gl"><h5>مريض ASCVD <u>ليس</u> عالي الخطورة جداً</h5><b>LDL-C &lt;70</b><b>non-HDL &lt;100</b><small>mg/dL · مع ستاتين عالي الشدة (≥50% خفض)</small></div>
<div class="gl vh"><h5>مريض ASCVD <u>عالي الخطورة جداً</u> (Very High Risk)</h5><b>LDL-C &lt;55</b><b>non-HDL &lt;85</b><small>mg/dL · مع ستاتين عالي الشدة (≥50% خفض)</small></div>
</div>
<h4>أ) غير عالي الخطورة جداً</h4>
${R('1','—','High-intensity statin to achieve ≥50% LDL-C reduction and goal <b>LDL-C &lt;70 mg/dL and non-HDL-C &lt;100 mg/dL</b>.')}
${R('2a','—','On maximally tolerated statin, it is reasonable to add <b>ezetimibe, a PCSK9 mAb, or bempedoic acid</b> to achieve LDL-C &lt;70 / non-HDL-C &lt;100.')}
${R('2a','—','On maximally tolerated statin, it is reasonable to add ezetimibe, PCSK9 mAb, or bempedoic acid to achieve a lower goal <b>LDL-C &lt;55 / non-HDL-C &lt;85</b>.')}
<h4>ب) عالي الخطورة جداً</h4>
${R('1','—','High-intensity statin to achieve ≥50% lowering and goal <b>LDL-C &lt;55 mg/dL and non-HDL-C &lt;85 mg/dL</b>.')}
${R('1','—','On maximally tolerated statin, <b>ezetimibe and/or a PCSK9 mAb should be added</b> to achieve LDL-C &lt;55 / non-HDL-C &lt;85.')}
${R('2a','—','It is reasonable to add <b>bempedoic acid</b> (± ezetimibe and/or PCSK9 mAb) to reach the goal.')}
${R('2a','—','It is reasonable to add <b>inclisiran</b> in those unable to tolerate or obtain evolocumab or alirocumab, or with a strong preference for less frequent dosing.')}
${BOX('exam','الفرق الذي يُسأل عنه',`في <b>Very High Risk</b> إضافة ezetimibe/PCSK9 mAb = <span class="pill c1">1 (should)</span>، أما في <b>غير Very High Risk</b> = <span class="pill c2a">2a (reasonable)</span>.`)}

<h3>4) من هو "عالي الخطورة جداً" (Very High Risk)؟</h3>
<div class="vhr">
<div class="vb"><b>≥ 2</b> أحداث ASCVD كبرى</div>
<div class="or">أو</div>
<div class="vb"><b>1</b> حدث كبير <b>+ ≥ 2</b> حالات عالية الخطورة</div>
</div>
${T(['حالات عالية الخطورة (High-Risk Conditions)'],[
['العمر ≥65 سنة'],['CABG أو PCI سابق'],['مدخّن حالي'],['السكري'],['ارتفاع ضغط الدم'],['تاريخ فشل قلب احتقاني'],['LDL-C ≥100 mg/dL رغم أقصى ستاتين محتمل + ezetimibe']
])}
<p class="small">الأحداث الكبرى (Major ASCVD events) المعروفة من دلائل ACC/AHA: متلازمة شريانية حادة حديثة، تاريخ احتشاء، جلطة دماغية إقفارية، مرض شرايين طرفية مصحوب بأعراض. <br>📝 المرجع ينبّه أيضاً: انتبه للتداخلات بين أدوية الدهون والأدوية المضادة للفيروسات القهقرية (antiretrovirals).</p>
${BOX('tip','جرّب الأداة',`في قسم <b>الأدوات</b> ستجد «حاسبة هدف LDL» التي تحدد لك إن كان المريض Very High Risk وما هو هدفه.`)}

<h3>5) الشكل 8: خطوات تصعيد علاج الدهون</h3>
<div class="flow">
<div class="fs">نمط حياة صحي لكل المرضى</div><div class="arr">⬇</div>
<div class="fs g">Statin عالي الشدة (هدف ↓≥50%)</div><div class="arr">⬇ إذا لم يتحمّل</div>
<div class="fs y">Statin متوسط الشدة</div><div class="arr">⬇ إذا لم يُحقق الهدف</div>
<div class="fs g">أضف Ezetimibe و/أو PCSK9 mAb</div><div class="arr">⬇ إذا غير كافٍ أو غير متحمّل</div>
<div class="fs o">Bempedoic acid، أو Inclisiran (بدل PCSK9 mAb)</div>
</div>
<p class="small">* تأثير bempedoic acid و inclisiran على MACE ما زال قيد التقييم. ** إذا كان المريض على أقصى ستاتين مع LDL-C &lt;100 وبقيت الدهون الثلاثية الصائمة <b>150–499 mg/dL</b> بعد معالجة الأسباب الثانوية ← قد يُنظر في <b>icosapent ethyl</b> <span class="pill c2b">2b</span>.</p>

<h2 class="part">الجزء الثاني: مضادات الصفائح ومضادات التخثر الفموية (OAC)</h2>
<h3>6) بدون حاجة لمضاد تخثر فموي</h3>
${R('1','A','No indication for OAC: <b>low-dose aspirin 81 mg (75–100 mg)</b> is recommended to reduce atherosclerotic events.')}
${R('1','A','Treated with PCI: <b>DAPT (aspirin + clopidogrel) for 6 months</b> post PCI, followed by SAPT, to reduce MACE and bleeding.')}
${R('2a','A','Selected patients after PCI with DES who completed <b>1–3 months of DAPT</b>: <b>P2Y12 inhibitor monotherapy for ≥12 months</b> is reasonable to reduce bleeding risk.')}
${R('2b','A','Previous MI and <b>low bleeding risk</b>: extended DAPT beyond 12 months for up to <b>3 years</b> may be reasonable.')}
${R('2b','B-R','Previous MI <b>without</b> history of stroke, TIA, or ICH: <b>vorapaxar</b> may be added to aspirin.')}
${R('2b','B-R','DAPT after <b>CABG</b> may be useful to reduce saphenous vein graft occlusion.')}
${R('3NB','A','Without recent ACS or a PCI-related indication: adding <b>clopidogrel to aspirin is not useful</b>.')}
${R('3H','A','Previous stroke, TIA, or ICH: <b>vorapaxar should not be added</b> to DAPT (major bleeding & ICH).')}
${R('3H','B-R','Previous stroke, TIA, or ICH: <b>prasugrel should not be used</b> (significant or fatal bleeding).')}
${R('3H','B-R','<b>Chronic NSAIDs should not be used</b> (increased CV and bleeding complications).')}
${BOX('mem','ثلاثي "الجلطة الدماغية السابقة" المحظور',`مريض لديه تاريخ <b>Stroke / TIA / ICH</b> ← ممنوع: <b>Vorapaxar</b> و<b>Prasugrel</b>. تذكرها: «<b>V</b>ery <b>P</b>rohibited after stroke».`)}

<h3>7) مع حاجة لمضاد تخثر فموي (مثلاً رجفان أذيني)</h3>
${R('1','B-R','After elective PCI requiring OAC: <b>DAPT for 1–4 weeks</b>, then <b>clopidogrel alone for 6 months</b>, in addition to a <b>DOAC</b>.','ESC 2024: إيقاف الأسبرين مبكراً (≤ أسبوع).')}
${R('2a','B-R','After PCI requiring OAC: continuing aspirin + clopidogrel for <b>up to 1 month</b> is reasonable if high thrombotic risk and low bleeding risk.')}
${R('2b','B-R','Requiring OAC with low atherothrombotic risk: discontinue antiplatelet with continuation of <b>DOAC alone 1 year after PCI</b> may be considered.')}
${R('2b','C-LD','Requiring OAC: <b>DOAC monotherapy</b> may be considered if no acute indication for concomitant antiplatelet therapy.')}
<h4>جرعة منخفضة من DOAC</h4>
${R('2a','B-R','No indication for therapeutic DOAC or DAPT, at <b>high risk of recurrent ischemic events but low-to-moderate bleeding risk</b>: adding <b>rivaroxaban 2.5 mg twice daily</b> to aspirin 81 mg daily is reasonable.')}
<h4>DAPT و مثبطات مضخة البروتون</h4>
${R('2a','B-R','On DAPT, the use of a <b>PPI</b> can be effective in reducing GI bleeding risk.')}

<h3>8) الشكل 9: مدة العلاج المضاد للصفائح (ملخّص مرئي)</h3>
${T(['الحالة','الشهر 0–1','حتى 6 أشهر','حتى 12 شهر','بعد 12 شهر'],[
['<b>بدون OAC</b> — لا PCI أو &gt;12 شهر من ACS','Aspirin','Aspirin','Aspirin','Aspirin'],
['<b>بدون OAC</b> — ACS سابق ± PCI','DAPT','DAPT','DAPT','قد يُمدد DAPT 12–36 شهر (2b)'],
['<b>بدون OAC</b> — PCI، نزف/إقفار منخفض-متوسط','DES DAPT','DAPT حتى 6 أشهر','SAPT','SAPT'],
['<b>بدون OAC</b> — PCI، خطر نزف عالٍ','DAPT 1–3 أشهر','P2Y12 أحادي','P2Y12','SAPT'],
['<b>مع OAC</b> — PCI، خطر منخفض-متوسط','DOAC + clopidogrel + aspirin (≤1 شهر)','DOAC + clopidogrel','DOAC وحده','DOAC وحده'],
['<b>مع OAC</b> — PCI، خطر إقفاري عالٍ','DOAC + clopidogrel + aspirin (1 شهر)','DOAC + clopidogrel (1–6 أشهر)','DOAC','DOAC'],
['<b>مع OAC</b> — بدون PCI','DOAC وحده','DOAC وحده','DOAC وحده','DOAC وحده']
],'small')}

<h2 class="part">الجزء الثالث: أدوية وقائية أخرى</h2>
<h3>9) حاصرات بيتا (للوقاية وليس للأعراض)</h3>
${R('1','A','<b>LVEF ≤40%</b> with or without previous MI: beta-blocker is recommended to reduce MACE including CV death.')}
${R('1','A','<b>LVEF &lt;50%</b>: use <b>sustained-release metoprolol succinate, carvedilol, or bisoprolol</b> titrated to target doses in preference to other beta blockers.')}
${R('2b','B-NR','Started on BB for previous MI without (history of or current) LVEF ≤50%, angina, arrhythmias, or uncontrolled HTN: it may be reasonable to <b>reassess long-term (&gt;1 year)</b> use.')}
${R('3NB','B-NR','<b>Without previous MI or LVEF ≤50%</b>: BB is not beneficial in reducing MACE in the absence of another primary indication.')}
${BOX('mem','الثلاثي المثبت في فشل القلب',`<b>"Metoprolol Succinate – Carvedilol – Bisoprolol"</b> = <b>MCB</b>. لاحظ: metoprolol <b>succinate</b> وليس tartrate.`)}

<h3>10) مثبطات نظام الرينين–أنجيوتنسين</h3>
${R('1','A','CCD with <b>hypertension, diabetes, LVEF ≤40%, or CKD</b>: ACE inhibitors (or ARBs if ACEi-intolerant) are recommended.')}
${R('2b','B-R','CCD <b>without</b> HTN, DM, CKD and with LVEF &gt;40%: ACEi or ARBs may be considered.')}
${BOX('mem','متى ACEi قوية (1)؟',`<b>"HDL-C"</b>: <b>H</b>TN – <b>D</b>iabetes – <b>L</b>VEF ≤40% – <b>C</b>KD.`)}

<h3>11) الكولشيسين</h3>
${R('2b','B-R','Addition of <b>colchicine</b> for secondary prevention may be considered to reduce recurrent ASCVD events.','يعمل على الالتهاب — تذكّر أن الالتهاب أساسي في التصلّب (الفصل 2).')}
${BOX('sum','خلاصة الفصل',`<ul><li>Statin عالي الشدة للجميع (Atorva 40–80 / Rosuva 20–40).</li><li>أهداف 2026: &lt;70/&lt;100 عموماً، &lt;55/&lt;85 للـ Very High Risk.</li><li>Very High Risk = ≥2 أحداث كبرى أو حدث + ≥2 حالات خطورة.</li><li>Aspirin 81 للجميع بدون OAC؛ DAPT 6 أشهر بعد PCI اختياري.</li><li>OAC + PCI: DAPT 1–4 أسابيع ← clopidogrel حتى 6 أشهر + DOAC ← DOAC وحده بعد سنة.</li><li>ممنوع: NSAIDs مزمنة، Prasugrel/Vorapaxar بعد stroke.</li><li>BB يُفيد MACE فقط مع LVEF ≤40% (أو MI حديث)؛ ACEi مع HTN/DM/LVEF≤40%/CKD.</li></ul>`)}
`});

CHAPTERS.push({id:8,icon:'🩸',title:'الضغط والسكري والكلى والسمنة وفشل القلب',en:'Managing HTN, Diabetes, CKD, Obesity & Concomitant HF',mins:16,
body:`
<div class="author">مريضك الحقيقي لن يأتيك بمرض واحد. سيأتيك بذبحة + ضغط + سكري + ربما فشل قلب. مهارتك هنا: أن تختار أدوية <b>تخدم أكثر من مرض في وقت واحد</b>، وأن تتجنّب <b>التكرار الضار</b> و<b>موانع الاستعمال</b>.</div>

<h3>1) ضغط الدم</h3>
${R('1','A','Nonpharmacologic strategies are recommended as <b>first-line</b> therapy in those with <b>elevated BP (120–129/&lt;80 mm Hg)</b>.')}
${R('1','B-R','In adults with CCD and hypertension, a <b>BP target of &lt;130/&lt;80 mm Hg</b> is recommended.')}
${R('1','B-R','HTN (≥130 and/or ≥80): in addition to nonpharmacologic strategies, <b>ACEi, ARBs, or beta blockers</b> are first-line for compelling indications (recent MI or angina), with additional agents (<b>DHP CCB, long-acting thiazide, and/or MRA</b>) added as needed.')}
<div class="cards2">
<div class="mini g"><b>الخط الأول (مع دواعٍ مقنعة)</b><span>ACEi / ARB / Beta-blocker</span></div>
<div class="mini b"><b>إضافات عند الحاجة</b><span>DHP CCB · Thiazide طويل المفعول · MRA</span></div>
</div>

<h3>2) السكري: SGLT2i و GLP-1 RA</h3>
${R('1','A','CCD with <b>type 2 diabetes</b>: either an <b>SGLT2 inhibitor or a GLP-1 receptor agonist</b> with proven CV benefit is recommended to reduce MACE.')}
${R('1','B-NR','<b>Cost value:</b> adding a GLP-1 RA at US prices is projected to be of <b>high value</b>; adding an SGLT2i of <b>intermediate value</b>.')}
<p>هدف <b>HbA1c ≤7%</b> (حسب خوارزمية Pharmacotherapy)، مع تعديل نمط الحياة والتغذية بما يناسب مريض السكري.</p>

<h3>3) فشل القلب المرافق</h3>
${R('1','A','CCD and <b>HF with LVEF ≤40%</b>: an <b>SGLT2 inhibitor</b> is recommended to reduce CV death and HF hospitalization and improve QOL, <b>irrespective of diabetes</b>.')}
${R('2a','B-R','CCD and <b>HF with LVEF &gt;40%</b>: SGLT2i can be beneficial to decrease HF hospitalizations and improve QOL, irrespective of diabetes.')}
<p class="small">قيمة التكلفة: إضافة SGLT2i مع LVEF ≤40% = قيمة متوسطة؛ مع LVEF &gt;40% = قيمة غير مؤكدة (بأسعار أمريكا).</p>

<h3>4) الكلى والسمنة</h3>
<ul class="nice"><li><b>CKD</b> ← ACEi (أو ARB) توصية <span class="pill c1">1</span>.</li><li><b>السمنة</b> ← استشارة غذائية ونمط حياة، ثم <b>GLP-1 RA</b> (semaglutide أفضل)، ثم جراحة السمنة؛ وتجنّب أدوية التنحيف المحاكية للودي (3: Harm). (التفاصيل في الفصل 6)</li></ul>

<h3>5) فن الدمج الآمن — جدول "افعل / لا تفعل"</h3>
${T(['الموقف','✅ الصحيح','⛔ الخطأ / السبب'],[
['ذبحة + <b>HFrEF</b> (LVEF ≤40%)','BB مثبت (MCB) + ACEi/ARB + SGLT2i؛ وللأعراض: amlodipine أو nitrate','<b>Verapamil/Diltiazem</b> (non-DHP) تُضعف الانقباض وتسوء فشل القلب؛ وverapamil ممنوع في HF'],
['ذبحة + ضغط مرتفع غير مسيطر','BB ثم أضف <b>DHP CCB</b> (amlodipine)','إضافة nitrate وحده لا يكفي لعلاج الضغط'],
['ذبحة + بطء قلب أو AV block','DHP CCB، nitrate، ranolazine','BB أو verapamil/diltiazem (تزيد البطء والحصار)'],
['BB + CCB معاً','BB + <b>DHP</b> (amlodipine) = تركيبة ممتازة (DHP يسبب tachycardia انعكاسية يعادلها BB)','BB + <b>non-DHP</b> = خطر بطء شديد وحصار AV (تكرار ضار)'],
['ذبحة + سكري','SGLT2i أو GLP-1 RA + ACEi + statin','الانتباه أن BB قد يخفي أعراض هبوط السكر (glucose intolerance)'],
['ذبحة + ربو','CCB كخط أول بديل','BB غير الانتقائية (مانع نسبي: asthma)'],
['ذبحة + ضعف انتصاب يستخدم sildenafil','تجنّب النترات تماماً أو الالتزام بالفاصل','Nitrate + PDE5i ← هبوط ضغط شديد (3: Harm)'],
['Ivabradine','—','مع non-DHP CCB أو مثبطات CYP3A4 القوية: غير موصى'],
['Ranolazine + Metformin','Metformin ≤1700 mg/يوم مع ranolazine 1000 mg مرتين','تثبيط OCT2 يرفع metformin'],
['Ranolazine + Simvastatin','Simvastatin ≤20 mg','ranolazine يقلل استقلاب ركائز CYP3A']
],'small')}
${BOX('sum','خلاصة الفصل',`<ul><li>هدف الضغط &lt;130/80؛ ACEi/ARB/BB أولاً ثم DHP CCB/thiazide/MRA.</li><li>سكري ← SGLT2i أو GLP-1 RA (1, A).</li><li>HFrEF ← SGLT2i (1, A) بغض النظر عن السكري؛ HFpEF ← 2a.</li><li>تجنّب non-DHP CCB في HFrEF، وتجنّب BB + non-DHP.</li></ul>`)}
`});

CHAPTERS.push({id:9,icon:'⚕️',title:'أدوية الذبحة: BB و CCB والنترات و Ranolazine',en:'Antianginal Therapy: Beta Blockers, CCBs, Nitrates & Ranolazine',mins:30,
body:`
<div class="author">هذا فصل <b>الصيدلاني بامتياز</b>: آليات، جرعات، آثار جانبية، موانع، تداخلات. نصيحتي: اربط كل دواء بميزان العرض والطلب الذي تعلّمته في الفصل 2، وستجد أن معظم المعلومات <b>تُستنتج ولا تُحفظ</b>.</div>

<h3>1) توصيات علاج الأعراض</h3>
${R('1','B-R','Antianginal therapy with either a <b>beta blocker, CCB, or long-acting nitrate</b> is recommended for relief of angina.','⚠️ ESC 2024: النترات <b>ليست</b> خطاً أول.')}
${R('1','B-R','Remaining symptomatic after initial treatment: add a <b>second antianginal agent from a different class</b>.')}
${R('1','B-R','<b>Ranolazine</b> is recommended in patients who remain symptomatic despite BB, CCB, or long-acting nitrate.')}
${R('1','B-NR','<b>Sublingual nitroglycerin or nitroglycerin spray</b> is recommended for immediate short-term relief of angina.')}
${R('3H','B-R','CCD with <b>normal LV function</b>: adding <b>ivabradine</b> to standard antianginal therapy is potentially harmful.')}
${R('2b','B-R','Refractory angina with no other options: <b>enhanced external counterpulsation (EECP)</b> may be considered.')}

<h3>2) علاج النوبة الحادة ⚡</h3>
${BOX('key','SL Nitroglycerin (GTN)',`<ul><li><b>القرص تحت اللسان:</b> 200–400 ميكروغرام (نصف إلى قرص)، يُكرر كل <b>3–4 دقائق</b> حتى يزول الألم، بحد أقصى <b>2–3 أقراص خلال 15 دقيقة</b>.</li><li><b>البخاخ تحت اللسان:</b> 400–800 ميكروغرام (1–2 بخة).</li><li><b>للوقاية:</b> قبل نشاط معروف أنه يثير الذبحة بـ <b>2–5 دقائق</b>، ويستمر المفعول ~<b>30 دقيقة</b>.</li><li><b>Isosorbide dinitrate</b> تحت اللسان: نصف عمر أطول، مفعول حتى <b>ساعتين</b>.</li></ul>`)}
<p><b>كل</b> مريض لديه تاريخ ذبحة يجب أن يحمل SL NTG أقراصاً أو بخاخاً. النترات هي الخطوة الأولى للنوبات الحادة إذا كانت النوبات قليلة (بضع مرات في الشهر) أو للوقاية قبل نشاط مثير.</p>

<h3>3) حاصرات بيتا (Beta-blockers)</h3>
<div class="drug">
<div class="dr"><span>الآلية</span><p>↓ الطلب على الأكسجين عبر خفض <b>النبض، قوة الانقباض، والضغط</b>. (وإطالة الانبساط ← تحسين الإرواء)</p></div>
<div class="dr"><span>المكانة</span><p><b>خط أول</b> لكل المرضى بدون موانع.</p></div>
<div class="dr"><span>الجرعات</span><p>Atenolol 25–200 mg مرة يومياً · Metoprolol tartrate 100–450 mg/يوم مقسمة 2–3 · Propranolol 80–320 mg/يوم مقسمة 2–4 (طويل المفعول: 80–320 مرة يومياً)</p></div>
<div class="dr"><span>آثار جانبية</span><p>بطء القلب، هبوط الضغط، <b>عدم تحمّل الغلوكوز</b>، تعب، عدم تحمّل الجهد، تفاقم العرج المتقطع (claudication)</p></div>
<div class="dr"><span>موانع مطلقة</span><p>بطء شديد، متلازمة العقدة الجيبية المريضة (sick sinus)، حصار AV، فشل قلب <b>غير مستقر</b></p></div>
<div class="dr"><span>موانع نسبية</span><p>الربو، الاكتئاب، مرض الأوعية الطرفية</p></div>
</div>
${BOX('tip','هدف علاجي عملي',`نُعاير BB للوصول لنبض راحة مناسب (غالباً 55–60/د) مع تحمّل جيد. <b>لا تُوقف BB فجأة</b> — قد يحدث ارتداد إقفاري.`)}

<h3>4) حاصرات قنوات الكالسيوم (CCBs)</h3>
<div class="drug">
<div class="dr"><span>الآلية</span><p>توسيع الشرايين الجهازية والتاجية ← ↑ تدفق الدم التاجي و↓ استهلاك الأكسجين. Non-DHP تخفض النبض والانقباض أيضاً.</p></div>
<div class="dr"><span>المكانة</span><p>خط أول إذا وُجدت موانع لـ BB، أو آثار جانبية غير مقبولة، أو سيطرة غير كافية بـ BB وحده. <b>الخيار المفضل في الذبحة التشنّجية</b>.</p></div>
<div class="dr"><span>الجرعات</span><p><b>Amlodipine</b> 5–10 mg/يوم (5 لكبار السن) · <b>Diltiazem</b> ER كبسولة 120–180 مرة يومياً (أقصى 480)، ER قرص 180–360، IR 180–360 مقسمة · <b>Felodipine</b> 2.5–10 مرة يومياً · <b>Nifedipine</b> IR 10–30 ثلاث مرات، SR 30–60 مرة · <b>Verapamil</b> 240–480/يوم مقسمة 3–4 (40 mg ثلاث مرات لكبار السن وصغار الحجم)</p></div>
<div class="dr"><span>آثار جانبية</span><p>بطء، هبوط ضغط، <b>إمساك</b> (verapamil)، تفاقم فشل القلب، <b>وذمة طرفية</b> (DHP)، إطالة QT (bepridil)، حصار AV (verapamil, diltiazem)، تسرّع زائد (nifedipine)</p></div>
<div class="dr"><span>تداخل</span><p><b>Digoxin</b> (verapamil/diltiazem ترفع مستواه)</p></div>
<div class="dr"><span>موانع</span><p><b>DHP:</b> فرط الحساسية. <b>Non-DHP:</b> MI حاد مع احتقان رئوي، WPW، حصار AV، هبوط ضغط عرضي، sick sinus، صدمة قلبية، فشل القلب (verapamil)</p></div>
</div>
${T(['','DHP (Amlodipine, Nifedipine, Felodipine)','Non-DHP (Verapamil, Diltiazem)'],[
['التأثير الأساسي','توسيع أوعية قوي','على القلب: ↓ النبض و↓ الانقباض'],
['النبض','↑ تسرّع انعكاسي (خاصة nifedipine IR)','↓ بطء'],
['الأثر الجانبي المميّز','وذمة الكاحل، صداع، توهّج','إمساك، حصار AV'],
['مع BB','✅ تركيبة ممتازة','⛔ خطر بطء/حصار'],
['في HFrEF','Amlodipine آمن','⛔ تجنّب']
],'small')}

<h3>5) النترات (Nitrates)</h3>
<div class="drug">
<div class="dr"><span>الآلية</span><p>توسيع الأوردة (أساساً) والشرايين الطرفية ← ↓ <b>preload</b> ← ↓ شد الجدار ← ↓ الطلب على الأكسجين. (عبر NO ← ↑ cGMP)</p></div>
<div class="dr"><span>المكانة</span><p>علاج الذبحة لمن ليس لديه دواعٍ مقنعة لأدوية أخرى، أو كعلاج مساعد.</p></div>
<div class="dr"><span>ISDN</span><p>فموي IR: 5–40 mg أربع مرات · SR: 40 mg كل 8–12 ساعة · تحت اللسان: 2.5–5 mg كل 5–10 د (أقصى 3 جرعات خلال 15–30 د)، وللوقاية قبل النشاط بـ 15 د</p></div>
<div class="dr"><span>ISMN</span><p>عادي: 5–20 mg مرتين بفاصل ≥12 ساعة بين الجرعتين · ER: 30–60 mg صباحاً، يُعاير كل 3 أيام حتى أقصى 240 mg · بخاخ: 0.4 mg/بخة كل 5 د (أقصى 3 خلال 15 د)</p></div>
<div class="dr"><span>آثار جانبية</span><p><b>صداع</b> (نابض)، دوخة، هبوط ضغط، توهّج، تسرّع انعكاسي، إغماء؛ نادراً: <b>methemoglobinemia</b> (أيونات النترات تؤكسد الهيموغلوبين)</p></div>
<div class="dr"><span>موانع</span><p>فرط الحساسية، <b>PDE5 inhibitors</b>، ارتفاع الضغط داخل القحف، هبوط الضغط العرضي. الحذر: SBP &lt;90 أو HR &lt;50</p></div>
</div>

<h4>🔁 تحمّل النترات (Nitrate Tolerance)</h4>
<ul class="nice">
<li>قصة تاريخية: «<b>Monday disease</b>» عند عمال الذخائر: صداع يوم الاثنين بعد عطلة نهاية الأسبوع (فقدوا التحمّل)، وحالات وفاة بسبب الانسحاب.</li>
<li><b>الآليات المقترحة:</b> ↓ إنتاج cGMP، ↑ cGMP phosphodiesterase، استنزاف مجموعات sulfhydryl (cysteine) بالـ peroxynitrite، تنشيط الأنظمة العصبية الهرمونية، ↑ الحجم داخل الأوعية.</li>
<li><b>الحل:</b> تجنّب الجرعات على مدار الساعة؛ ترك <b>فترة خالية من النترات 8–12 ساعة</b> (مع الانتباه لخطر الإقفار الارتدادي/الصامت خلالها). Acetylcysteine (مانح sulfhydryl)، أو استخدام مرافق لـ ACEi أو carvedilol أو hydralazine.</li>
</ul>
<h4>💥 تداخلات دوائية خطيرة</h4>
${T(['الدواء','المشكلة','الفاصل الزمني'],[
['Sildenafil','PDE5i يمنع تكسير cGMP ← هبوط ضغط شديد','24 ساعة'],
['Vardenafil','نفس الآلية','24 ساعة'],
['Tadalafil','نفس الآلية (نصف عمر طويل)','<b>48 ساعة</b>'],
['Heparin','مقاومة الهيبارين مع NTG وريدي &gt;350 mcg/min','—']
])}
<h4>📦 مستحضرات النترات</h4>
${T(['المستحضر','ملاحظات'],[
['IV infusion','للحالات الحادة في المستشفى'],
['أقراص/كبسولات بطيئة التحرر','<b>لأغلب مرضى الذبحة المستقرة</b>: رخيصة، 2–3 مرات يومياً، تسمح بفترة خالية؛ استقلاب كبدي أول كبير'],
['لصقات جلدية','غالية، جرعة غير مرنة، قد لا تسمح بفترة خالية (تُنزع ليلاً)'],
['مراهم','فوضوية (messy)!'],
['أقراص شدقية لاصقة','غالية، لا ميزة حقيقية'],
['أقراص وبخاخ تحت اللسان','بداية سريعة، تتجاوز الكبد؛ <b>للنوبات الحادة والوقاية</b>']
])}
<p>ثلاث مجموعات: <b>Glyceryl trinitrate</b>، <b>Isosorbide dinitrate</b> (يُستقلب إلى mononitrate)، <b>Isosorbide mononitrate</b>.</p>

<h3>6) Ranolazine</h3>
<div class="drug">
<div class="dr"><span>الآلية</span><p>تثبيط <b>تيار الصوديوم المتأخر</b> <e>(late inward Na⁺ current, late I<sub>Na</sub>)</e></p></div>
<div class="dr"><span>المكانة</span><p>علاج مركّب مع amlodipine أو nitrates أو BB لمن لم يُسيطر عليه بعلاج أحادي. <b>لا يغير النبض والضغط تقريباً</b>.</p></div>
<div class="dr"><span>الجرعة</span><p>يبدأ <b>500 mg مرتين</b>، يُعاير حتى أقصى <b>1000 mg مرتين</b></p></div>
<div class="dr"><span>آثار جانبية</span><p>دوخة، صداع، إمساك، غثيان، <b>Torsades de pointes</b> (إطالة QT)</p></div>
<div class="dr"><span>موانع</span><p>خلل كبدي شديد (cirrhosis)، إطالة QT مسبقة أو أدوية مطيلة لـ QT، مثبطات CYP3A القوية</p></div>
</div>
<h4>كيف يعمل؟ (سلسلة الأحداث)</h4>
<div class="flow">
<div class="fs">الإقفار</div><div class="arr">⬇</div>
<div class="fs">↑ تيار الصوديوم المتأخر (Late I<sub>Na</sub>)</div><div class="arr">⬇</div>
<div class="fs">فرط الصوديوم داخل الخلية ← فرط الكالسيوم (عبر مبادل Na⁺/Ca²⁺)</div><div class="arr">⬇</div>
<div class="fs">فشل الارتخاء الانبساطي (↑ الشد الانبساطي، تيبّس البطين)</div><div class="arr">⬇</div>
<div class="fs o">ضغط خارجي على الأوعية ← ↓ الإرواء ← مزيد من الإقفار (حلقة مفرغة)</div>
</div>
<p class="center"><b>Ranolazine يكسر الحلقة</b> بتثبيط Late I<sub>Na</sub>. عواقب خلل هذا التيار: <b>ميكانيكية</b> (انقباض/ارتخاء غير طبيعي)، <b>استقلابية</b> (↑ استهلاك ATP، ↓ إنتاجه)، <b>كهربائية</b> (EADs، اضطرابات نظم VT).</p>
<h4>موانع واحتياطات Ranolazine (جدول تفصيلي)</h4>
${T(['موانع الاستعمال','احتياطات'],[
['<b>تشمّع الكبد</b>: يرفع التركيز 30–80% ← خطر QT','مثبطات CYP3A4 المتوسطة (diltiazem، verapamil، عصير الجريب فروت، erythromycin، fluconazole) ترفع التركيز (الضعف مع diltiazem/verapamil)'],
['<b>مثبطات CYP3A4 القوية</b> (ketoconazole، clarithromycin، nelfinavir) ترفع التركيز (3.2 ضعف مع ketoconazole)','إطالة QT مسبقة، تاريخ torsades، أو أدوية أخرى مطيلة لـ QT'],
['<b>محفزات CYP3A4</b> (rifampin، phenobarbital، phenytoin، carbamazepine، St. John\'s wort) تُبطل الفعالية (↓95% مع rifampin)','مثبطات P-gp (cyclosporine) ترفع الامتصاص حتى 50%'],
['','القصور الكلوي يرفع التركيز'],
['','يرفع ركائز P-gp: <b>digoxin ×1.5</b>'],
['','يقلل استقلاب ركائز CYP2D6'],
['','يرفع ركائز OCT2: <b>metformin ≤1700 mg/يوم</b> مع ranolazine 1000 mg مرتين'],
['','يقلل استقلاب ركائز CYP3A: <b>simvastatin ≤20 mg</b>']
],'small')}

<h3>7) الأدوية الحديثة المضادة للذبحة</h3>
<p>رغم التصعيد بـ BB و nitrates و CCB، يبقى عدد من المرضى يعاني ذبحة مستمرة. الأدوية الحديثة آلياتها <b>مكمّلة</b> للأدوية التقليدية:</p>
${T(['الدواء','الآلية','معلومات مهمة'],[
['<b>Ivabradine</b>','تثبيط تيار <b>I<sub>f</sub></b> ("funny") في العقدة الجيبية ← ↓ النبض فقط','غير أدنى من atenolol/amlodipine (7.5–10 mg مرتين)؛ تجربة ASSOCIATE: مع atenolol حسّن الجهد. آثار: بطء، <b>phosphenes</b> (ومضات ضوئية)، صداع، تشوش رؤية. ESC 2024: <b>غير موصى</b> كإضافة إذا LVEF &gt;40% بلا HF. لا يُجمع مع non-DHP CCB أو مثبطات CYP3A4 القوية'],
['<b>Nicorandil</b>','يفتح قنوات K⁺ الحساسة لـ ATP (توسيع الشرينات) + جزء nitrate (توسيع الشرايين والأوردة)','تجربة <b>IONA</b>: ↓17% في الأحداث القلبية ← قد يحمي القلب (ischemic preconditioning)'],
['<b>Trimetazidine</b>','معدّل استقلابي: يثبط أكسدة الأحماض الدهنية (β-oxidation) ← يحوّل للغلوكوز الذي يحتاج أكسجين أقل','تجربة <b>TACT</b>: مع nitrates أو BB حسّن الجهد وقلل النوبات'],
['<b>Fasudil</b>','مثبط <b>Rho kinase</b> (يمنع التقبض الوعائي)','زاد زمن الوصول لـ ST depression &gt;1 mm وحسّن مدة الجهد؛ <b>لا يؤثر على النبض والضغط</b>']
],'small')}
${BOX('mem','حيلة الأدوية الحديثة',`<b>"I Need To Fly"</b>: <b>I</b>vabradine (I<sub>f</sub>) · <b>N</b>icorandil (K<sub>ATP</sub>) · <b>T</b>rimetazidine (metabolic) · <b>F</b>asudil (Rho kinase) + Ranolazine (late Na).`)}
${BOX('sum','خلاصة الفصل',`<ul><li>BB خط أول؛ CCB بديل أو إضافة (والأفضل في التشنّجية)؛ nitrates ليست خطاً أول في ESC 2024.</li><li>NTG تحت اللسان: كل 3–4 د، أقصى 2–3 خلال 15 د.</li><li>تحمّل النترات ← فترة خالية 8–12 ساعة.</li><li>PDE5i: 24 ساعة (sildenafil/vardenafil)، 48 ساعة (tadalafil).</li><li>Ranolazine: late Na، 500–1000 mg مرتين، QT، CYP3A4، metformin ≤1700، simva ≤20.</li><li>Ivabradine مع LV طبيعي = 3: Harm.</li></ul>`)}
`});

CHAPTERS.push({id:10,icon:'🏥',title:'إعادة التروية: PCI مقابل CABG والمتابعة',en:'Revascularization: PCI vs CABG & Treatment Follow-up',mins:15,
body:`
<div class="author">كثير من مرضى الذبحة المستقرة يُعالَجون بالأدوية وحدها بنجاح. لكن متى نحتاج «سباكة» للشرايين؟ وأيهما أفضل: الدعامة أم القلب المفتوح؟ هذا ما سنحسمه هنا.</div>

<h3>1) متى نلجأ لإعادة التروية؟</h3>
<ol class="nice"><li>ذبحة <b>تحدّ من نمط الحياة</b> رغم GDMT.</li><li>تشريح شرياني عالي الخطورة، أو مرضى تحسّن إعادة التروية <b>بقاءهم</b>.</li><li>الاختيار بين PCI و CABG يعتمد على: التشريح، تعقيد المرض، LVEF، السكري، الخطر الجراحي، وتفضيل المريض.</li></ol>
${T(['الحالة السريرية','النهج المفضّل'],[
['ذبحة مستمرة رغم GDMT','PCI أو CABG لتخفيف الأعراض'],
['مرض الجذع الرئيسي الأيسر مع تشريح معقّد','<b>CABG مفضّل</b>'],
['مرض متعدد الشرايين مع LVEF ≤35%','CABG يحسّن البقاء للمرشحين المناسبين'],
['سكري + مرض متعدد الشرايين يشمل LAD','<b>CABG مفضّل عموماً</b>'],
['مرض منتشر معقد (SYNTAX &gt;33)','CABG مفضّل عموماً'],
['مرض موضعي بتشريح مناسب','PCI غالباً مناسب']
])}

<h3>2) توصيات الدليل</h3>
${R('1','A','Lifestyle-limiting angina despite GDMT with significant stenoses amenable to revascularization: revascularization is recommended to <b>improve symptoms</b>.')}
${R('1','B-R','Significant <b>left main</b> disease or <b>multivessel disease with severe LV dysfunction (LVEF ≤35%)</b>: <b>CABG</b> + medical therapy is recommended over medical therapy alone to <b>improve survival</b>.')}
${R('2a','B-R','Multivessel CAD appropriate for CABG or PCI: revascularization + GDMT is reasonable to lower risk of spontaneous MI, urgent revascularization, or cardiac death.')}
${R('2a','B-NR','Selected patients with significant left main stenosis for whom PCI can provide revascularization equivalent to CABG: PCI is reasonable to improve survival.')}
<h4>PCI مقابل CABG</h4>
${R('1','B-R','Left main involvement with <b>high-complexity</b> CAD: <b>CABG over PCI</b> to improve survival.')}
${R('2a','B-R','Multivessel complex and diffuse CAD (<b>SYNTAX &gt;33</b>): reasonable to choose CABG over PCI.')}
${R('2a','B-NR','Appropriate for revascularization but <b>poor surgical candidates</b>: reasonable to choose <b>PCI</b> over CABG.')}
${R('1','A','<b>Diabetes + multivessel CAD involving LAD</b>, appropriate for CABG: <b>CABG (with LIMA to LAD)</b> is recommended over PCI to reduce mortality and repeat revascularization.')}
${R('2b','B-R','Diabetes with left main stenosis and low/intermediate complexity (SYNTAX ≤33): PCI may be considered as an alternative to CABG.')}

<h3>3) جراحة المجازة التاجية CABG</h3>
<ul class="nice"><li>وضع <b>طُعوم</b> لتجاوز الشرايين المتضيقة.</li><li>الطعوم: <b>الوريد الصافن</b> <e>(saphenous vein)</e> من الساق، أو شرايين: <b>الشريان الثديي الداخلي الأيسر</b> <e>(LIMA)</e>، أو <b>الشريان الكعبري</b> <e>(radial artery)</e>.</li><li>يُخاط الوريد بين <b>الأبهر الصاعد</b> والشريان التاجي <b>بعد</b> مكان التضيّق.</li></ul>
${BOX('key','الوقاية الثانوية بعد CABG',`<ul><li>Aspirin مدى الحياة (ما لم يوجد مانع).</li><li>Statin عالي الشدة أو أقصى ما يُحتمل؛ وإضافة non-statin عند الحاجة.</li><li>هدف LDL-C: <b>&lt;55</b> في Very High Risk (ACC/AHA 2026)؛ <b>&lt;70</b> لبقية ASCVD (مع هدف أقل معقول لبعضهم).</li><li>ضبط الضغط والسكري، الإقلاع عن التدخين، والتأهيل القلبي.</li><li>DAPT بعد CABG قد يفيد لمنع انسداد طعم الوريد الصافن (2b).</li></ul>`)}

<h3>4) التدخل التاجي عبر الجلد PCI</h3>
<ul class="nice"><li>يعيد تدفق الدم عبر قسطرة تعالج التضيّق.</li><li>توسيع بالبالون + غالباً <b>دعامة دوائية DES</b>.</li><li>DES تُطلق أدوية مضادة للتكاثر (<b>paclitaxel</b> أو <b>sirolimus</b>) موضعياً لمنع <b>عودة التضيّق</b> <e>(restenosis)</e>.</li><li>المدخل عبر <b>الشريان الكعبري (radial)</b> مفضّل لأنه يقلل النزف والمضاعفات الوعائية.</li></ul>
${BOX('warn','اعتبارات مهمة',`<ul><li><b>PCI يخفف الذبحة بفعالية لكنه لا يحسّن البقاء عند كل مرضى CAD المستقر.</b></li><li>المضاعفات: نزف، عودة التضيّق، <b>تخثر الدعامة</b>، أذية كلوية من المادة الظليلة.</li><li>بعد PCI اختياري: aspirin + clopidogrel لمدة <b>6 أشهر</b> عادة (أقصر لمن لديهم خطر نزف عالٍ).</li><li><b>استمر بالوقاية الثانوية مدى الحياة</b> حتى لو نجح الـ PCI.</li></ul>`)}

<h3>5) تقييم النتائج والمتابعة</h3>
${T(['المجال','ماذا نقيّم؟'],[
['<b>أعراض الذبحة</b>','تحسّن القدرة على الجهد، أعراض أقل عند نفس الجهد، استبيانات. مع العلاج الأمثل يتحسن خلال <b>2–4 أسابيع</b> ويبقى مستقراً ما لم يتقدّم المرض'],
['<b>أداء القلب</b>','يُقيَّم فقط إذا فشل العلاج الدوائي أو للمرضى عاليي الخطورة جداً'],
['<b>عوامل الخطر</b>','تقييم وإعادة تقييم مستمرة (الدهون 4–12 أسبوع بعد بدء الستاتين، الضغط، السكر، التدخين)']
])}
${BOX('sum','خلاصة الفصل',`<ul><li>PCI = للأعراض غالباً؛ CABG = يحسن البقاء في left main وmultivessel مع LVEF ≤35% والسكري مع LAD.</li><li>SYNTAX &gt;33 ← CABG؛ خطر جراحي عالٍ ← PCI.</li><li>DES: paclitaxel/sirolimus؛ radial access مفضّل.</li><li>الوقاية الثانوية مدى الحياة بعد أي إجراء.</li></ul>`)}
`});
